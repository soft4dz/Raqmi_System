<!doctype html>
<html lang="fr" data-theme="clair" data-densite="confortable" data-sidebar="repliee">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — accueil « Poste de travail » (concept 1)</title>
<!--
  Maquette autonome du concept 1 « Poste de travail » (docs/design/accueil/explorations/1-tache/concept.md).
  Aucune dependance reseau, aucune police externe. Les couleurs sont les brushes de RaqmiTheme.xaml /
  ThemePalette.Sombre, clef par clef (memes variables que docs/design/maquette-shell.html). Les SVG
  reprennent les geometries ModuleGroupIcon.* du theme.

  TOUTES LES DONNEES SONT DES EXEMPLES : les chiffres ne viennent d'aucun serveur ; chaque carte porte
  en info-bulle la route et le champ qui l'alimenteraient. Les droits par profil sont ceux de
  SecuritySeeder (le profil Reception est un role personnalise a creer).
-->
<style>
  /* ============ Palette : brushes de RaqmiTheme.xaml / ThemePalette.Sombre ============ */
  :root, [data-theme="clair"] {
    --structure:#071525; --structure-elevated:#0C2135; --header-fg:#FFFFFF; --header-muted:#9FC3DC;
    --app-bg:#F4F7FA; --surface:#FFFFFF; --surface-subtle:#EEF4F8; --surface-hover:#E4EDF4;
    --panel-border:#DCE6EF; --field-border:#7A8FA3; --border-strong:#B9CCDD;
    --text:#0F2337; --text-2:#4A6A87; --text-muted:#5B6C7E; --text-label:#475569; --placeholder:#5C7188;
    --accent:#0AA3AD; --accent-hover:#0DB6C1; --accent-pressed:#088790;
    --accent-action:#07767D; --accent-action-hover:#08838B; --accent-action-fg:#FFFFFF;
    --accent-soft:#E1F4F5; --accent-selection:rgba(10,163,173,.18);
    --primary:#073B78; --secondary:#145CAB; --danger:#C0392B; --danger-soft:#FBECEA; --danger-border:#EFC9C4;
    --focus:#073B78; --focus-on-filled:#FFFFFF; --focus-on-dark:#FFFFFF;
    --disabled-bg:#E5EBF1; --disabled-fg:#576C82; --disabled-border:#DDE5EC;
    --module-active:rgba(10,163,173,.10);
    --row-hover:#F0F6FA; --row-alt:#FAFCFE; --grid-header-fg:#5B7591;
    --shadow:rgba(7,21,37,.07);
    --mat-planned-bg:#E8EEF4; --mat-planned-fg:#46617B; --mat-planned-accent:#7798B5;
    --mat-preview-bg:#FBEBC8; --mat-preview-fg:#8A5A08; --mat-preview-accent:#BF8B16;
    --mat-functional-bg:#DDF2F4; --mat-functional-fg:#096B73; --mat-functional-accent:#0AA3AD;
    --mat-ready-bg:#DCF3E5; --mat-ready-fg:#14713C; --mat-ready-accent:#1F9D57;
    --status-available-bg:#DCF3E5; --status-available-fg:#14713C;
    --status-planned-bg:#E8EEF4; --status-planned-fg:#46617B;
    --status-draft-bg:#E2E8F0; --status-draft-fg:#475569;
    --status-submitted-bg:#FCEFC7; --status-submitted-fg:#92600A;
    --status-validated-bg:#DBF2E3; --status-validated-fg:#187A41;
    --status-rejected-bg:#FBE3E1; --status-rejected-fg:#B3261E;
    --progress-available:#1F9D57; --progress-planned:#7798B5;
  }
  [data-theme="sombre"] {
    --structure:#050F1C; --structure-elevated:#0C1B2B; --header-fg:#EAF2F9; --header-muted:#8FB0CA;
    --app-bg:#0E1826; --surface:#152233; --surface-subtle:#1B2B3E; --surface-hover:#22344A;
    --panel-border:#26374D; --field-border:#62748D; --border-strong:#4B6E93;
    --text:#E6EEF7; --text-2:#AFC3D6; --text-muted:#98AFC6; --text-label:#C2D2E1; --placeholder:#8DA4BC;
    --accent:#22C4CE; --accent-hover:#3ED5DE; --accent-pressed:#16A8B1;
    --accent-action:#2FCBD6; --accent-action-hover:#4CDAE3; --accent-action-fg:#062227;
    --accent-soft:#0E3B40; --accent-selection:rgba(34,196,206,.24);
    --primary:#5B9BE8; --secondary:#6FAEF0; --danger:#F4776A; --danger-soft:#3A1A17; --danger-border:#5E2D28;
    --focus:#7FB6F5; --focus-on-filled:#08222A; --focus-on-dark:#EAF2F9;
    --disabled-bg:#1C2938; --disabled-fg:#8195AB; --disabled-border:#26374D;
    --module-active:rgba(34,196,206,.15);
    --row-hover:#1B2B3E; --row-alt:#182637; --grid-header-fg:#9CB3C9;
    --shadow:rgba(0,0,0,.35);
    --mat-planned-bg:#212F3F; --mat-planned-fg:#A8BCD0; --mat-planned-accent:#506D91;
    --mat-preview-bg:#3A2D12; --mat-preview-fg:#EFC15C; --mat-preview-accent:#E5B23A;
    --mat-functional-bg:#0E3439; --mat-functional-fg:#4FD3DC; --mat-functional-accent:#22C4CE;
    --mat-ready-bg:#11321F; --mat-ready-fg:#68D397; --mat-ready-accent:#3FBF74;
    --status-available-bg:#11321F; --status-available-fg:#68D397;
    --status-planned-bg:#212F3F; --status-planned-fg:#A8BCD0;
    --status-draft-bg:#26313E; --status-draft-fg:#C4D0DC;
    --status-submitted-bg:#3B2E11; --status-submitted-fg:#F5C761;
    --status-validated-bg:#11321F; --status-validated-fg:#68D397;
    --status-rejected-bg:#3A1A19; --status-rejected-fg:#F58C82;
    --progress-available:#3FBF74; --progress-planned:#506D91;
  }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family: Manrope, "Noto Kufi Arabic", "Segoe UI", sans-serif; font-size:13px; color:var(--text); background:var(--app-bg); display:flex; flex-direction:column; min-height:100vh; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.thin { stroke-width:1.4; }
  [hidden] { display:none !important; }

  /* ============ Barre de la maquette (hors produit) ============ */
  .maquette-bar { background:var(--structure-elevated); color:var(--header-fg); font-size:12px; padding:8px 24px; display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
  .maquette-bar strong { color:var(--header-muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; font-size:10.5px; }
  .maquette-bar .grp { display:flex; align-items:center; gap:6px; }
  .maquette-bar .seg { display:inline-flex; border:1px solid rgba(255,255,255,.22); border-radius:15px; overflow:hidden; }
  .maquette-bar .seg button { padding:5px 11px; color:var(--header-fg); font-weight:600; font-size:12px; }
  .maquette-bar .seg button[aria-pressed="true"] { background:var(--accent); color:#062227; }
  .maquette-bar .note { margin-left:auto; color:var(--header-muted); }

  /* ============ En-tete ============ */
  header.entete { height:76px; background:var(--structure); color:var(--header-fg); display:flex; align-items:center; padding:0 24px; gap:12px; }
  .marque { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-weight:600; font-size:20px; }
  .entete h1 { font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .entete .signature { font-size:12px; color:var(--header-muted); }
  .entete .session { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--header-muted); }
  .entete .session b { color:var(--header-fg); font-weight:600; }
  .entete .ghost { border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; color:var(--header-fg); font-size:12px; display:inline-flex; gap:8px; align-items:center; }
  .entete .ghost:focus-visible { outline-color:var(--focus-on-dark); }

  /* ============ Corps : barre laterale + contenu ============ */
  .app { flex:1; display:grid; grid-template-columns:248px 1fr; gap:20px; padding:24px 24px 0; min-height:0; }
  .app.racine { grid-template-columns:1fr; }
  .app.racine aside { display:none; }
  [data-sidebar="affichee"] .app.racine { grid-template-columns:248px 1fr; }
  [data-sidebar="affichee"] .app.racine aside { display:flex; }
  .carte { background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; }
  aside { padding:18px 14px; display:flex; flex-direction:column; min-height:0; align-self:start; }
  .etiquette { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px 14px; }
  .nav-btn { width:100%; height:40px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-radius:6px; color:var(--text-2); font-size:13px; text-align:left; position:relative; }
  .nav-btn:hover { background:var(--surface-subtle); }
  .nav-btn[aria-current="page"] { background:var(--module-active); color:var(--text); font-weight:600; }
  .nav-btn[aria-current="page"]::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:1.5px; background:var(--accent); }
  .recherche { position:relative; margin-top:12px; }
  .recherche input { width:100%; min-height:34px; padding:0 32px; border:1px solid var(--field-border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche input::placeholder { color:var(--placeholder); }
  .recherche svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--placeholder); }
  .domaines { margin-top:14px; overflow:auto; flex:1; padding-right:4px; max-height:520px; }
  .domaine { margin-bottom:2px; }
  .dom-tete { width:100%; height:36px; display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; padding:0 10px; border-radius:6px; color:var(--text); font-size:12.5px; font-weight:600; text-align:left; }
  .dom-tete:hover { background:var(--surface-subtle); }
  .dom-tete svg.ic { color:var(--text-muted); margin-right:10px; }
  .dom-tete .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom-tete .compteur { background:var(--surface-subtle); color:var(--text-2); font-size:10.5px; font-weight:400; border-radius:8px; padding:1px 7px; margin-left:8px; }
  .dom-tete .chevron { width:9px; height:7px; margin-left:8px; color:var(--text-muted); transition:transform .12s; transform:rotate(-90deg); }
  .dom-tete[aria-expanded="true"] .chevron { transform:rotate(0); }
  .point { width:7px; height:7px; border-radius:50%; margin-left:8px; display:inline-block; }
  .point.preview { background:var(--mat-preview-accent); }
  .ecrans { margin:2px 0 8px; }
  .ecrans .nav-btn { height:34px; margin-left:8px; width:calc(100% - 8px); font-size:12.5px; margin-bottom:2px; }
  .epingle { border-top:1px solid var(--panel-border); margin-top:10px; padding-top:8px; }
  .epingle:empty { display:none; }

  /* ============ Bandeau de session (Grid.Row 2, toutes les vues) ============ */
  .session-zone { padding:14px 24px 24px; }
  .busy { height:4px; border-radius:2px; background:transparent; overflow:hidden; }
  .busy.actif { background:var(--surface-hover); }
  .busy.actif::after { content:""; display:block; height:100%; width:30%; background:var(--accent-action); animation:glisse 1.2s linear infinite; }
  @keyframes glisse { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  .session-strip { border-top:1px solid var(--panel-border); padding:10px 8px 8px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); border-radius:0 0 6px 6px; transition:background .3s; }
  .session-strip .etiquette { margin:0 4px 0 0; }
  .session-strip .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .session-strip.erreur .dot { background:var(--danger); }
  .session-strip.erreur span:last-child { color:var(--danger); }
  .session-strip.flash-info { background:var(--accent-soft); }
  .session-strip.flash-erreur { background:var(--danger-soft); }

  /* ============ Fil d'Ariane ============ */
  .ariane { height:32px; display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:12px; }
  .ariane svg.ic { color:var(--text-2); }
  .ariane button { color:var(--text-2); font-weight:600; padding:3px 6px; border-radius:5px; }
  .ariane button:hover { background:var(--surface-subtle); color:var(--text); }
  .ariane .courant { color:var(--text); font-weight:600; padding:3px 6px; }
  .ariane .sep { width:9px; height:7px; color:var(--text-muted); transform:rotate(-90deg); }
  .ariane .badge { margin-left:auto; }

  /* ============ Badges ============ */
  .badge { display:inline-flex; align-items:center; border-radius:9px; padding:2.5px 9px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .badge.planned { background:var(--mat-planned-bg); color:var(--mat-planned-fg); }
  .badge.preview { background:var(--mat-preview-bg); color:var(--mat-preview-fg); }
  .badge.functional { background:var(--mat-functional-bg); color:var(--mat-functional-fg); }
  .badge.ready { background:var(--mat-ready-bg); color:var(--mat-ready-fg); }
  .badge.dispo { background:var(--status-available-bg); color:var(--status-available-fg); }
  .badge.planifie { background:var(--status-planned-bg); color:var(--status-planned-fg); }
  .badge.draft { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .badge.soumise { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .badge.validee { background:var(--status-validated-bg); color:var(--status-validated-fg); }
  .badge.rejetee { background:var(--status-rejected-bg); color:var(--status-rejected-fg); }

  /* ============ Ecran cible (stub du shell) ============ */
  main { min-width:0; display:flex; flex-direction:column; }
  .ecran { padding:20px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .ecran-tete { display:flex; align-items:flex-start; gap:12px; }
  .ecran-tete h2 { font-size:21px; font-weight:600; margin:0; }
  .ecran-tete .sous { font-size:12.5px; color:var(--text-2); margin-top:4px; }
  .ecran-tete .actions { margin-left:auto; display:flex; gap:8px; }
  .btn { min-height:36px; padding:7px 15px; border-radius:6px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px; }
  .btn.secondaire { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); }
  .btn.secondaire:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .btn.primaire { background:var(--accent-action); color:var(--accent-action-fg); padding:7px 18px; }
  .btn.primaire:hover { background:var(--accent-action-hover); }
  .btn.primaire:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .btn.fantome { min-height:34px; padding:6px 12px; color:var(--secondary); }
  .btn.fantome:hover { background:var(--surface-subtle); }
  .onglets { display:flex; border-bottom:1px solid var(--panel-border); }
  .onglet { padding:9px 18px; font-size:13px; font-weight:600; color:var(--text-2); border-radius:6px 6px 0 0; position:relative; }
  .onglet:hover { background:var(--surface-subtle); }
  .onglet[aria-selected="true"] { color:var(--primary); }
  .onglet[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2.5px; background:var(--accent); }
  .filtres { background:var(--surface-subtle); border:1px solid var(--panel-border); border-radius:8px; padding:12px 16px; display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .champ { display:flex; flex-direction:column; gap:6px; }
  .champ label { font-size:12px; font-weight:600; color:var(--text-label); }
  .champ input, .champ select { min-height:34px; padding:0 10px; border:1px solid var(--field-border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; width:180px; }
  .grille { border:1px solid var(--panel-border); border-radius:8px; overflow:hidden; position:relative; min-height:230px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--grid-header-fg); font-size:12px; height:40px; padding:0 12px; border-bottom:1px solid var(--panel-border); background:var(--surface); }
  td { height:40px; padding:0 12px; border-bottom:1px solid var(--panel-border); }
  [data-densite="compact"] th { height:34px; } [data-densite="compact"] td { height:32px; }
  tr:nth-child(even) td { background:var(--row-alt); }
  tbody tr:hover td { background:var(--row-hover); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .vide { position:absolute; inset:40px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; pointer-events:none; }
  .vide svg { width:32px; height:32px; stroke-width:1.3; color:var(--text-muted); margin-bottom:6px; }
  .vide .titre { font-size:14px; font-weight:600; color:var(--text-2); }
  .vide .indice { font-size:12px; color:var(--text-muted); text-align:center; }

  /* ============ Accueil : Poste de travail ============ */
  .poste { display:flex; flex-direction:column; gap:20px; }
  [data-densite="compact"] .poste { gap:14px; }
  .sections { display:flex; gap:8px; align-items:center; }
  .puce { border:1px solid var(--panel-border); background:var(--surface); border-radius:15px; padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--text-2); display:inline-flex; gap:8px; align-items:center; }
  .puce:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .puce[aria-pressed="true"] { background:var(--accent-action); border-color:var(--accent-action); color:var(--accent-action-fg); }
  .puce[aria-pressed="true"]:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .sections .exemple { margin-left:auto; font-size:11.5px; color:var(--text-muted); }

  .bandeau { padding:22px 24px 18px; display:flex; align-items:flex-start; gap:16px; }
  [data-densite="compact"] .bandeau { padding:16px 20px 14px; }
  .bandeau h2 { font-size:26px; font-weight:600; margin:0; }
  .bandeau .date { font-size:13px; color:var(--text-2); margin-top:7px; }
  .bandeau .synthese { font-size:12.5px; color:var(--text-2); margin-top:8px; display:flex; flex-wrap:wrap; gap:0 6px; }
  .bandeau .synthese b { color:var(--text); font-weight:600; }
  .bandeau .liens { display:flex; gap:4px; margin-top:12px; margin-left:-12px; }
  .bandeau .droite { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .bandeau .unite { display:flex; align-items:center; gap:8px; }
  .bandeau .unite label { font-size:12px; font-weight:600; color:var(--text-label); }
  .bandeau .unite select { min-height:34px; padding:0 10px; border:1px solid var(--field-border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; min-width:260px; }
  .bandeau .unite .texte { font-size:12.5px; color:var(--text); font-weight:600; }
  .bandeau .actualise { font-size:11.5px; color:var(--text-muted); }

  .avert { background:var(--status-submitted-bg); border:1px solid var(--status-submitted-fg); border-radius:8px; padding:9px 14px; color:var(--status-submitted-fg); font-size:13px; font-weight:600; display:flex; gap:10px; align-items:center; }
  .avert .lien { margin-left:auto; color:var(--status-submitted-fg); text-decoration:underline; font-weight:600; }

  .bande-tete { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px; letter-spacing:.02em; }
  .bande-tete .pt { width:8px; height:8px; border-radius:50%; }
  .bande-tete .nb { border-radius:8px; padding:1px 7px; font-size:10.5px; font-weight:600; }
  .bande.retard .pt { background:var(--status-rejected-fg); } .bande.retard .nb { background:var(--status-rejected-bg); color:var(--status-rejected-fg); }
  .bande.jour .pt { background:var(--status-submitted-fg); } .bande.jour .nb { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .bande.veille .pt { background:var(--text-muted); } .bande.veille .nb { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .files { display:grid; grid-template-columns:repeat(auto-fill, minmax(224px, 1fr)); gap:14px; }
  [data-densite="compact"] .files { gap:10px; }
  .file { padding:16px 14px 14px; min-height:104px; display:flex; flex-direction:column; gap:5px; }
  [data-densite="compact"] .file { padding:12px 12px 10px; min-height:88px; }
  .file .tete { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-muted); font-weight:600; }
  .file .tete svg { color:var(--accent-pressed); }
  .file .tete .cible-nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .perimetre { margin-left:auto; background:var(--surface-subtle); color:var(--text-2); border-radius:8px; padding:1px 7px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .file.suivi .perimetre, .file.zero .perimetre { background:var(--surface); }
  .file .compte { font-size:27px; font-weight:600; line-height:1.15; margin-top:6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .file .compte .montant { font-size:13px; font-weight:600; color:var(--text-2); }
  .file .libelle { font-size:13.5px; font-weight:600; }
  .file .legende { font-size:11.5px; color:var(--text-muted); }
  .file .cta { margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:8px; }

const PERIMETRE_LIB = { unite:() => uniteCourante() || "Unité", groupe:() => "Groupe", moi:() => "Ma décision", systeme:() => "Système" };

/* ======================= Etat ======================= */
const etat = {
  profil:"reception", theme:"clair", densite:"confortable", sidebar:"repliee", uniteAffectee:true, uniteCode:"ALG-CEN",
  simulation:"charge", section:"poste", racine:true, courant:null, deroules:new Set(), heure:"08:12",
};
const has = cle => { const p = PROFILS[etat.profil]; return !!p.tout || p.permissions.includes(cle); };
const uniteCourante = () => etat.uniteAffectee ? etat.uniteCode : null;

/* ======================= Composeur (miroir de WorkbenchComposer : fonction pure des permissions) ======================= */
function composer() {
  const slots = []; let unitaireSansUnite = false;
  for (const q of FILES) {
    if (!has(q.lecture)) continue;
    const mode = (q.action && !has(q.action)) ? "suivi" : "faire";
    const cible = ecranParOnglet(q.cible.tab);
    const verrou = !has(cible.e.perm);
    if (q.perimetre === "unite" && !uniteCourante()) { unitaireSansUnite = true; continue; }
    slots.push({ q, mode, verrou, cible });
  }
  return { slots, unitaireSansUnite };
}
/* Projection (miroir de WorkbenchProjection : fonction pure des reponses) */
function projeter(slot) {
  const q = slot.q;
  if (etat.simulation === "chargement") return { etat:"chargement", bande:q.bande };
  if (etat.simulation === "erreur" && SOURCES_EN_ERREUR.has(q.source)) return { etat:"indisponible", bande:q.bande };
  const r = q.projeter(DONNEES);
  return { etat:"pret", compte:r.compte, montant:r.montant || null, legende:r.legende, bande:r.bande || q.bande, libelle:r.libelle || q.libelle };
}
function cartesParBande() {
  const { slots, unitaireSansUnite } = composer();
  const bandes = { retard:[], jour:[], veille:[] };
  for (const s of slots) {
    const p = projeter(s);
    if (p.bande === "masquee") continue;
    if (p.etat === "pret" && typeof p.compte === "number" && p.compte === 0 && p.bande !== "jour") continue;
    bandes[p.bande].push({ ...s, ...p, zero: p.etat === "pret" && p.compte === 0 });
  }
  for (const b of Object.values(bandes)) b.sort((a, c) => (a.mode === c.mode) ? 0 : (a.mode === "faire" ? -1 : 1));
  return { bandes, unitaireSansUnite, nbFiles: slots.length };
}

/* ======================= Rendu : accueil « Poste de travail » ======================= */
function rendreCarte(c) {
  const lib = c.libelle || c.q.libelle;
  const perim = PERIMETRE_LIB[c.q.perimetre]();
  const tete = `<div class="tete">${svg(c.cible.d.cle, "ic thin")}<span class="cible-nom">${c.cible.e.nom} › ${c.cible.e.sousModules[c.q.cible.onglet] || c.cible.e.sousModules[0]}</span><span class="perimetre">${perim}</span></div>`;
  const titre = `title="Exemple — ${c.q.route}"`;
  if (c.etat === "chargement") {
    return `<article class="carte file" ${titre} aria-label="${lib}, chargement" aria-busy="true">${tete}<div class="squelette" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="libelle">${lib}</div><div class="cta"><button type="button" class="btn-file voir" disabled>Chargement…</button></div></article>`;
  }
  if (c.etat === "indisponible") {
    return `<article class="carte file indispo" ${titre} aria-label="${lib}, indisponible">${tete}<div class="compte">—</div><div class="libelle">${lib}</div>
      <div class="legende">Détail dans le bandeau de session · F5 pour réessayer</div>
      <div class="cta"><span class="badge rejetee">Indisponible</span></div></article>`;
  }
  const modeCls = c.mode === "suivi" ? "suivi" : (c.zero ? "zero" : "");
  const verbe = c.mode === "suivi" || !c.q.action ? (c.q.action ? "Voir" : c.q.verbe) : c.q.verbe;
  const btnCls = (c.mode === "faire" && c.q.action) ? "act" : "voir";
  const bouton = c.verrou
    ? `<button type="button" class="btn-file ${btnCls}" disabled title="Accès non autorisé pour votre profil (${c.cible.e.perm})" aria-label="${verbe} — accès non autorisé pour votre profil">${svg("Cadenas", "cadenas", "0 0 12 12")}${verbe}</button>`

/* ======================= Navigation : un seul chemin (NavigateToModule) ======================= */
function brancherNavigation(racine) {
  racine.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => { const [tab, i] = b.dataset.open.split("|"); ouvrir(+tab, +i); }));
  racine.querySelectorAll("[data-section]").forEach(b => { if (!b.closest(".sections")) b.addEventListener("click", () => { etat.section = b.dataset.section; rendre(); }); });
}
function ouvrir(tab, onglet = 0) {
  const cible = ecranParOnglet(tab);
  if (!cible || !has(cible.e.perm)) { setStatus(`« ${cible ? cible.e.nom : "?"} » n'est pas ouvert à votre profil (CanOpenModule).`, true); return; }
  etat.racine = false; etat.courant = { d:cible.d, e:cible.e, onglet }; etat.deroules.add(cible.d.id);
  rendre();
}
function allerRacine() { etat.racine = true; etat.courant = null; etat.section = "poste"; rendre(); }

/* ======================= Bandeau de session (SetStatus / FlashSessionStrip) ======================= */
let flashTimer = null;
function setStatus(message, erreur = false) {
  const strip = document.getElementById("session-strip");
  document.getElementById("session-texte").textContent = message;
  strip.classList.toggle("erreur", erreur);
  strip.classList.remove("flash-info", "flash-erreur"); void strip.offsetWidth;
  strip.classList.add(erreur ? "flash-erreur" : "flash-info");
  clearTimeout(flashTimer); flashTimer = setTimeout(() => strip.classList.remove("flash-info", "flash-erreur"), erreur ? 1600 : 900);
}
function actualiser() {
  if (!etat.racine) { setStatus("Cet écran n'a rien à actualiser (maquette)."); return; }
  const h = new Date(); etat.heure = `${String(h.getHours()).padStart(2, "0")}:${String(h.getMinutes()).padStart(2, "0")}`;
  rendre();
  if (etat.simulation === "erreur") setStatus("Le cockpit DEC et le front-desk n'ont pas répondu : HTTP 503 Service Unavailable (exemple). Les autres files sont à jour.", true);
  else if (etat.simulation === "chargement") setStatus("Chargement des files de travail…");
  else setStatus(`Files de travail actualisées à ${etat.heure} (exemple).`);
}

  document.getElementById("entete-session").innerHTML = `<b>${prof.utilisateur}</b> · ${prof.nom} · ${DONNEES.settings.company}`;
  document.getElementById("lbl-theme").textContent = etat.theme === "clair" ? "Sombre" : "Clair";
  document.getElementById("busy").classList.toggle("actif", etat.racine && etat.simulation === "chargement");
  for (const [attr, val] of [["profil", etat.profil], ["theme", etat.theme], ["densite", etat.densite], ["unite", etat.uniteAffectee ? "oui" : "non"], ["sim", etat.simulation], ["sidebar", etat.sidebar]])
    document.querySelectorAll(`.maquette-bar [data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === val));
  const sec = document.getElementById("ecran");
  rendreSidebar(); rendreAriane();
  if (etat.racine) { sec.className = ""; etat.section === "catalogue" ? rendreCatalogue(sec) : rendrePoste(sec); }
  else rendreEcran(sec);
}

document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.addEventListener("click", () => { etat.profil = b.dataset.profil; etat.deroules.clear(); allerRacine(); setStatus(`Prêt. Connecté en tant que ${PROFILS[etat.profil].utilisateur} (${PROFILS[etat.profil].role}).`); }));
document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.theme; rendre(); }));
document.querySelectorAll(".maquette-bar [data-densite]").forEach(b => b.addEventListener("click", () => { etat.densite = b.dataset.densite; rendre(); }));
document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.addEventListener("click", () => { etat.uniteAffectee = b.dataset.unite === "oui"; rendre(); }));
document.querySelectorAll(".maquette-bar [data-sim]").forEach(b => b.addEventListener("click", () => { etat.simulation = b.dataset.sim; actualiser(); }));
document.querySelectorAll(".maquette-bar [data-sidebar]").forEach(b => b.addEventListener("click", () => { etat.sidebar = b.dataset.sidebar; rendre(); }));
document.getElementById("btn-theme").addEventListener("click", () => { etat.theme = etat.theme === "clair" ? "sombre" : "clair"; rendre(); setStatus("Apparence appliquée aux écrans non encore ouverts ; redémarrage conseillé pour les autres (RedemarrageConseille)."); });
document.addEventListener("keydown", ev => {
  if (ev.altKey && ev.key === "Home") { ev.preventDefault(); allerRacine(); }
  if (ev.key === "F5") { ev.preventDefault(); actualiser(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === "k") { ev.preventDefault(); if (etat.racine) { etat.section = "catalogue"; rendre(); document.getElementById("home-search")?.focus(); } else document.querySelector("#sidebar input")?.focus(); }
});

rendre();
setStatus(`Prêt. Connecté en tant que ${PROFILS[etat.profil].utilisateur} (${PROFILS[etat.profil].role}).`);
</script>
</body>
</html>
