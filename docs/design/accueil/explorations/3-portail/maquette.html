<!doctype html>
<html lang="fr" data-theme="clair" data-densite="confortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploration 3 — Portail Mon Espace (accueil Raqmi System)</title>
<!--
  Maquette autonome de l'exploration 3 « Portail Mon Espace » (docs/design/accueil/explorations/3-portail/concept.md).
  Elle sert a trancher sur ecran, pas a etre integree : aucune dependance reseau, aucune police externe,
  DONNEES FICTIVES annotees comme exemples. Chaque tuile indique la route serveur qu'elle appellerait et
  la permission qui la fait apparaitre ; ce qui n'existe pas cote serveur n'apparait que comme noeud
  « Planifie ».

  Palette : les brushes de RaqmiTheme.xaml / ThemePalette.Sombre, clef par clef (reprises de
  docs/design/maquette-shell.html). Shell : en-tete 76 px, barre laterale 248 px (repliee sur l'accueil
  comme SyncSidebarToTab, commutateur de comparaison), fil d'Ariane masque sur l'accueil, bandeau de session.

  Commutateurs : profil (8 roles, permissions EXACTES de SecuritySeeder ; Reception = role personnalise
  a creer, decision 8 du README), theme, unite du poste (reglage local), etat des donnees (charge /
  chargement / erreur partielle), barre laterale, annotations.
-->
<style>
  /* ============ Palette : RaqmiTheme.xaml (clair) / ThemePalette.Sombre ============ */
  :root, [data-theme="clair"] {
    --structure:#071525; --structure-elevated:#0C2135; --header-fg:#FFFFFF; --header-muted:#9FC3DC;
    --app-bg:#F4F7FA; --surface:#FFFFFF; --surface-subtle:#EEF4F8; --surface-hover:#E4EDF4;
    --panel-border:#DCE6EF; --field-border:#7A8FA3; --border-strong:#B9CCDD;
    --text:#0F2337; --text-2:#4A6A87; --text-muted:#5B6C7E; --text-label:#475569; --placeholder:#5C7188;
    --accent:#0AA3AD; --accent-hover:#0DB6C1; --accent-pressed:#088790;
    --accent-action:#07767D; --accent-action-hover:#08838B; --accent-action-fg:#FFFFFF;
    --accent-soft:#E1F4F5; --accent-selection:rgba(10,163,173,.18);
    --primary:#073B78; --secondary:#145CAB; --danger:#C0392B; --danger-soft:#FBECEA; --danger-border:#EFC9C4;
    --focus:#073B78; --focus-on-filled:#FFFFFF; --focus-on-dark:#FFFFFF;
    --disabled-bg:#E5EBF1; --disabled-fg:#576C82; --disabled-border:#DDE5EC;
    --module-active:rgba(10,163,173,.10);
    --row-hover:#F0F6FA; --row-alt:#FAFCFE; --grid-header-fg:#5B7591;
    --shadow:rgba(7,21,37,.07); --shadow-hover:rgba(7,21,37,.20);
    --mat-planned-bg:#E8EEF4; --mat-planned-fg:#46617B; --mat-planned-accent:#7798B5;
    --mat-preview-bg:#FBEBC8; --mat-preview-fg:#8A5A08; --mat-preview-accent:#BF8B16;
    --mat-functional-bg:#DDF2F4; --mat-functional-fg:#096B73; --mat-functional-accent:#0AA3AD;
    --mat-ready-bg:#DCF3E5; --mat-ready-fg:#14713C; --mat-ready-accent:#1F9D57;
    --status-available-bg:#DCF3E5; --status-available-fg:#14713C;
    --status-planned-bg:#E8EEF4; --status-planned-fg:#46617B;
    --status-draft-bg:#E2E8F0; --status-draft-fg:#475569;
    --status-submitted-bg:#FCEFC7; --status-submitted-fg:#92600A;
    --status-validated-bg:#DBF2E3; --status-validated-fg:#187A41;
    --status-rejected-bg:#FBE3E1; --status-rejected-fg:#B3261E;
    --prog-available:#1F9D57; --prog-api:#0AA3AD; --prog-partial:#BF8B16; --prog-planned:#7798B5;
  }
  [data-theme="sombre"] {
    --structure:#050F1C; --structure-elevated:#0C1B2B; --header-fg:#EAF2F9; --header-muted:#8FB0CA;
    --app-bg:#0E1826; --surface:#152233; --surface-subtle:#1B2B3E; --surface-hover:#22344A;
    --panel-border:#26374D; --field-border:#62748D; --border-strong:#4B6E93;
    --text:#E6EEF7; --text-2:#AFC3D6; --text-muted:#98AFC6; --text-label:#C2D2E1; --placeholder:#8DA4BC;
    --accent:#22C4CE; --accent-hover:#3ED5DE; --accent-pressed:#16A8B1;
    --accent-action:#2FCBD6; --accent-action-hover:#4CDAE3; --accent-action-fg:#062227;
    --accent-soft:#0E3B40; --accent-selection:rgba(34,196,206,.24);
    --primary:#5B9BE8; --secondary:#6FAEF0; --danger:#F4776A; --danger-soft:#3A1A17; --danger-border:#5E2D28;
    --focus:#7FB6F5; --focus-on-filled:#08222A; --focus-on-dark:#EAF2F9;
    --disabled-bg:#1C2938; --disabled-fg:#8195AB; --disabled-border:#26374D;
    --module-active:rgba(34,196,206,.15);
    --row-hover:#1B2B3E; --row-alt:#182637; --grid-header-fg:#9CB3C9;
    --shadow:rgba(0,0,0,.35); --shadow-hover:rgba(0,0,0,.55);
    --mat-planned-bg:#212F3F; --mat-planned-fg:#A8BCD0; --mat-planned-accent:#506D91;
    --mat-preview-bg:#3A2D12; --mat-preview-fg:#EFC15C; --mat-preview-accent:#E5B23A;
    --mat-functional-bg:#0E3439; --mat-functional-fg:#4FD3DC; --mat-functional-accent:#22C4CE;
    --mat-ready-bg:#11321F; --mat-ready-fg:#68D397; --mat-ready-accent:#3FBF74;
    --status-available-bg:#11321F; --status-available-fg:#68D397;
    --status-planned-bg:#212F3F; --status-planned-fg:#A8BCD0;
    --status-draft-bg:#26313E; --status-draft-fg:#C4D0DC;
    --status-submitted-bg:#3B2E11; --status-submitted-fg:#F5C761;
    --status-validated-bg:#11321F; --status-validated-fg:#68D397;
    --status-rejected-bg:#3A1A19; --status-rejected-fg:#F58C82;
    --prog-available:#3FBF74; --prog-api:#22C4CE; --prog-partial:#E5B23A; --prog-planned:#506D91;
  }
  [data-densite="confortable"] { --grid-row:40px; }
  [data-densite="compact"] { --grid-row:32px; }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: Manrope, "Noto Kufi Arabic", "Segoe UI", sans-serif;
    font-size:13px; color:var(--text); background:var(--app-bg);
    display:flex; flex-direction:column; min-height:100vh;
  }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:disabled { cursor:default; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.thin { stroke-width:1.4; }
  .muted { color:var(--text-muted); font-weight:400; }
  .mono { font-family:Consolas, "Cascadia Mono", monospace; font-size:10.5px; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ============ Barre de la maquette (hors produit) ============ */
  .maquette-bar {
    background:var(--structure-elevated); color:var(--header-fg); font-size:12px;
    padding:8px 24px; display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .maquette-bar strong { color:var(--header-muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; font-size:10.5px; }
  .maquette-bar .grp { display:flex; align-items:center; gap:6px; }
  .maquette-bar .seg { display:inline-flex; border:1px solid rgba(255,255,255,.22); border-radius:15px; overflow:hidden; }
  .maquette-bar .seg button { padding:5px 11px; color:var(--header-fg); font-weight:600; font-size:12px; }
  .maquette-bar .seg button[aria-pressed="true"] { background:var(--accent); color:#062227; }
  .maquette-bar .note { margin-left:auto; color:var(--header-muted); }

  /* ============ En-tete (76 px) ============ */
  header.entete { height:76px; background:var(--structure); color:var(--header-fg); display:flex; align-items:center; padding:0 24px; gap:12px; }
  .marque { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-weight:600; font-size:20px; }
  .entete h1 { font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .entete .signature { font-size:12px; color:var(--header-muted); }
  .entete .session { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--header-muted); }
  .entete .session b { color:var(--header-fg); font-weight:600; }
  .entete .session .pt { width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px; }
  .entete .ghost { border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; color:var(--header-fg); font-size:12px; display:inline-flex; gap:8px; align-items:center; min-height:34px; }
  .entete .ghost:hover { background:rgba(255,255,255,.10); }
  .entete .ghost:focus-visible { outline-color:var(--focus-on-dark); }

  /* ============ Corps ============ */
  .app { flex:1; display:grid; grid-template-columns:248px 1fr; gap:20px; padding:24px 24px 0; min-height:0; }
  .app.racine { grid-template-columns:1fr; }
  .app.racine aside { display:none; }
  .carte { background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; }
  aside { padding:18px 14px; display:flex; flex-direction:column; min-height:0; align-self:start; }
  .etiquette { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px 14px; }
  .nav-btn { width:100%; height:40px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-radius:6px; color:var(--text-2); font-size:13px; text-align:left; position:relative; }
  .nav-btn:hover { background:var(--surface-subtle); }
  .nav-btn[aria-current="page"] { background:var(--module-active); color:var(--text); font-weight:600; }
  .nav-btn[aria-current="page"]::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:1.5px; background:var(--accent); }
  .recherche { position:relative; margin-top:12px; }
  .recherche input { width:100%; min-height:34px; padding:0 32px; border:1px solid var(--field-border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche input::placeholder { color:var(--placeholder); }
  .recherche svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--placeholder); }
  .domaines { margin-top:14px; overflow:auto; flex:1; padding-right:4px; max-height:62vh; }
  .domaine { margin-bottom:2px; }
  .dom-tete { width:100%; height:36px; display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; padding:0 10px; border-radius:6px; color:var(--text); font-size:12.5px; font-weight:600; text-align:left; }
  .dom-tete:hover { background:var(--surface-subtle); }
  .dom-tete svg.ic { color:var(--text-muted); margin-right:10px; }
  .dom-tete .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom-tete .compteur { background:var(--surface-subtle); color:var(--text-2); font-size:10.5px; font-weight:400; border-radius:8px; padding:1px 7px; margin-left:8px; }
  .dom-tete .chevron { width:9px; height:7px; margin-left:8px; color:var(--text-muted); transition:transform .12s; transform:rotate(-90deg); }
  .dom-tete[aria-expanded="true"] .chevron { transform:rotate(0); }
  .point { width:7px; height:7px; border-radius:50%; margin-left:8px; display:inline-block; }
  .point.preview { background:var(--mat-preview-accent); }
  .ecrans { margin:2px 0 8px; }
  .ecrans .nav-btn { height:34px; margin-left:8px; width:calc(100% - 8px); font-size:12.5px; margin-bottom:2px; }
  .epingle { border-top:1px solid var(--panel-border); margin-top:10px; padding-top:8px; }
  .epingle:empty { display:none; }

  /* ============ Bandeau de session (Grid.Row 2, toutes colonnes) ============ */
  .session-zone { padding:14px 24px 24px; }
  .progress { height:4px; border-radius:2px; background:var(--surface-hover); overflow:hidden; visibility:hidden; }
  .progress.actif { visibility:visible; }
  .progress span { display:block; height:100%; width:30%; background:var(--accent-action); animation:indet 1.2s linear infinite; }
  @keyframes indet { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  .session-bar { border-top:1px solid var(--panel-border); padding:10px 8px 8px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); border-radius:0 0 6px 6px; }
  .session-bar .etiquette { margin:0 4px 0 0; }
  .session-bar .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .session-bar.erreur .dot { background:var(--danger); }
  .session-bar.flash { animation:flashInfo .9s ease-out; }
  .session-bar.erreur.flash { animation:flashErr 1.6s ease-out; }
  @keyframes flashInfo { from { background:var(--accent-soft); } to { background:transparent; } }
  @keyframes flashErr { from { background:var(--danger-soft); } to { background:transparent; } }

  /* ============ Fil d'Ariane (masque sur l'accueil) ============ */
  .ariane { height:32px; display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:12px; }
  .ariane[hidden] { display:none; }
  .ariane svg.ic { color:var(--text-2); }
  .ariane button { color:var(--text-2); font-weight:600; padding:3px 6px; border-radius:5px; }
  .ariane button:hover { background:var(--surface-subtle); color:var(--text); }
  .ariane .courant { color:var(--text); font-weight:600; padding:3px 6px; }
  .ariane .sep { width:9px; height:7px; color:var(--text-muted); transform:rotate(-90deg); }
  .ariane .badge { margin-left:auto; }

  /* ============ Badges ============ */
  .badge { display:inline-flex; align-items:center; border-radius:9px; padding:2.5px 9px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .badge.planned { background:var(--mat-planned-bg); color:var(--mat-planned-fg); }
  .badge.preview { background:var(--mat-preview-bg); color:var(--mat-preview-fg); }
  .badge.functional { background:var(--mat-functional-bg); color:var(--mat-functional-fg); }
  .badge.ready { background:var(--mat-ready-bg); color:var(--mat-ready-fg); }
  .badge.dispo { background:var(--status-available-bg); color:var(--status-available-fg); }
  .badge.planifie { background:var(--status-planned-bg); color:var(--status-planned-fg); }
  .badge.brouillon { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .badge.soumise { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .badge.validee { background:var(--status-validated-bg); color:var(--status-validated-fg); }
  .badge.rejetee { background:var(--status-rejected-bg); color:var(--status-rejected-fg); }
  .badge.exemple { background:var(--surface-subtle); color:var(--text-muted); font-weight:600; }

  /* ============ Boutons ============ */
  .btn { min-height:36px; padding:7px 15px; border-radius:6px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px; }
  .btn.secondaire { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); }
  .btn.secondaire:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .btn.primaire { background:var(--accent-action); color:var(--accent-action-fg); padding:7px 18px; }
  .btn.primaire:hover { background:var(--accent-action-hover); }
  .btn.primaire:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .btn.fantome { min-height:34px; padding:6px 12px; color:var(--secondary); }
  .btn.fantome:hover { background:var(--surface-subtle); }
  .btn.fantome[aria-expanded="true"] { background:var(--module-active); color:var(--text); }
  .btn:disabled { color:var(--disabled-fg); background:var(--disabled-bg); border-color:var(--disabled-border); }

  /* ============ Ecran type (quand on quitte l'accueil) ============ */
  main { min-width:0; display:flex; flex-direction:column; }
  .ecran { padding:20px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .ecran-tete { display:flex; align-items:flex-start; gap:12px; }
  .ecran-tete h2 { font-size:21px; font-weight:600; margin:0; }
  .ecran-tete .sous { font-size:12.5px; color:var(--text-2); margin-top:4px; }
  .ecran-tete .actions { margin-left:auto; display:flex; gap:8px; }
  .onglets { display:flex; border-bottom:1px solid var(--panel-border); }
  .onglet { padding:9px 18px; font-size:13px; font-weight:600; color:var(--text-2); border-radius:6px 6px 0 0; position:relative; }
  .onglet:hover { background:var(--surface-subtle); }
  .onglet[aria-selected="true"] { color:var(--primary); }
  .onglet[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2.5px; background:var(--accent); }
  .grille { border:1px solid var(--panel-border); border-radius:8px; overflow:hidden; position:relative; min-height:230px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--grid-header-fg); font-size:12px; height:40px; padding:0 12px; border-bottom:1px solid var(--panel-border); background:var(--surface); }
  td { height:var(--grid-row); padding:0 12px; border-bottom:1px solid var(--panel-border); }
  tr:nth-child(even) td { background:var(--row-alt); }
  tbody tr:hover td { background:var(--row-hover); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .vide { position:absolute; inset:40px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; pointer-events:none; }
  .vide svg { width:32px; height:32px; stroke-width:1.3; color:var(--text-muted); margin-bottom:6px; }
  .vide .titre { font-size:14px; font-weight:600; color:var(--text-2); }
  .vide .indice { font-size:12px; color:var(--text-muted); text-align:center; }

  /* ============ Portail Mon Espace ============ */
  .portail { display:flex; flex-direction:column; gap:22px; }
  .reveal { animation:reveal .3s cubic-bezier(.2,.7,.3,1) both; }
  .reveal.d1 { animation-delay:.08s; } .reveal.d2 { animation-delay:.16s; }
  @keyframes reveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .exemple-bandeau { background:var(--surface-subtle); border:1px solid var(--panel-border); border-radius:8px; padding:8px 12px; font-size:11.5px; color:var(--text-muted); display:flex; gap:10px; align-items:center; }
  .exemple-bandeau svg { color:var(--text-muted); }

  .bandeau { padding:22px 24px; display:grid; grid-template-columns:1fr auto; gap:16px 28px; align-items:start; }
  .bandeau h2 { font-size:26px; font-weight:600; margin:0; line-height:1.15; }
  .bandeau .role { font-size:12.5px; color:var(--text-2); margin-top:7px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bandeau .date { font-size:13px; color:var(--text-2); margin-top:4px; }
  .bandeau .liens { display:flex; gap:4px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .bandeau .liens .espace { flex:1; }
  .identite { display:grid; grid-template-columns:auto auto; gap:7px 14px; font-size:12.5px; margin:0; align-items:baseline; }
  .identite dt { color:var(--text-muted); font-weight:600; font-size:11px; }
  .identite dd { margin:0; color:var(--text); }
  .identite .tag { display:inline-flex; align-items:center; gap:6px; }
  .panneau { grid-column:1 / -1; border-top:1px solid var(--panel-border); padding-top:14px; display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px 22px; font-size:12.5px; }
  .panneau .lib { font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:3px; }
  .panneau .seg { display:inline-flex; border:1px solid var(--panel-border); border-radius:15px; overflow:hidden; }
  .panneau .seg button { padding:4px 11px; font-size:11.5px; font-weight:600; color:var(--text-2); }
  .panneau .seg button[aria-pressed="true"] { background:var(--accent-action); color:var(--accent-action-fg); }
  .panneau .note { grid-column:1 / -1; font-size:11.5px; color:var(--text-muted); }

  .section h3 { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; letter-spacing:.01em; }
  .section h3 .aide { font-weight:400; }
  .tuiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(222px, 1fr)); gap:14px; }
  .tuile { text-align:left; padding:16px 18px 14px; display:flex; flex-direction:column; gap:8px; min-height:124px; position:relative; transition:transform .13s cubic-bezier(.2,.7,.3,1), box-shadow .13s; color:var(--text); }
  button.tuile:hover { box-shadow:0 2px 10px var(--shadow-hover); transform:translateY(-2px); border-color:var(--accent); }
  button.tuile:focus-visible { outline:2px solid var(--focus); outline-offset:-4px; }
  .tuile .tete { display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; }
  .tuile .tete svg { color:var(--text-muted); margin-left:auto; }
  .tuile .valeur { font-size:27px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
  .tuile .valeur small { font-size:12.5px; font-weight:600; color:var(--text-2); margin-left:5px; }
  .tuile .legende { font-size:11.5px; color:var(--text-muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; line-height:1.4; }

/* ======================= Etat de la maquette ======================= */
const etat = {
  profil:"reception", theme:"clair", unite:"defaut", donnees:"charge", sidebar:"masquee", annotations:true,
  racine:true, courant:null, deroules:new Set(), recherche:"", catalogueDeplie:false, filtreCatalogue:"tous",
  panneau:null, recents:[], densite:"confortable",
};
const DATE_LONGUE = "mercredi 2 septembre 2026";
const DATE_COURTE = "02/09/2026";

const permissions = () => PROFILS[etat.profil].permissions;
/* Equivalent de HasModulePermission + PermissionRegistry.AcceptedClaims : comparaison sans casse, alias acceptes via `requis`. */
const detient = cle => { const p = permissions(); return p === "*" || p.some(x => x.toLowerCase() === cle.toLowerCase()); };
const detientTous = groupes => groupes.every(g => g.some(detient));
const uniteDuPoste = () => etat.unite === "aucune" ? null : etat.unite === "poste" ? UNITE_POSTE : (PROFILS[etat.profil].unite ? UNITE_POSTE : null);
const normaliser = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* ======================= Composeur (fonction pure → MonEspaceComposer dans RaqmiSystem.Application) ======================= */
function composer() {
  const prof = PROFILS[etat.profil];
  const u = uniteDuPoste();
  const ok = c => detientTous(c.requis) && (!c.unite || u !== null);
  const files = CAPACITES.filter(c => c.genre === "file" && ok(c));
  const journee = CAPACITES.filter(c => c.genre === "journee" && ok(c));
  const ecrans = DOMAINES.map(d => ({ d, ecrans:d.ecrans.filter(e => detient(e.perm)) })).filter(g => g.ecrans.length);
  const nbEcrans = ecrans.reduce((n, g) => n + g.ecrans.length, 0);
  const aucuneAction = !CAPACITES.some(c => c.genre === "file" && detientTous(c.requis));
  const manqueUnite = !u && CAPACITES.some(c => c.unite && detientTous(c.requis));
  return { prof, u, files, journee, ecrans, nbEcrans, aucuneAction, manqueUnite,
    activite: detient("audit.read") ? "serveur" : "masque",
    dateMetier: u !== null && detient("lodging.read"),
    reglagesPoste: detient("settings.read") };
}

/* ======================= Navigation : un seul chemin (NavigateToModule) ======================= */
function ouvrir(idDomaine, nomEcran, onglet = 0) {
  const d = domaine(idDomaine); const e = d && d.ecrans.find(x => x.nom === nomEcran);
  if (!e || !detient(e.perm)) { setStatus(`« ${nomEcran} » n'est pas ouvert à votre profil.`, true); return; }   // CanOpenModule
  etat.racine = false; etat.courant = { domaine:idDomaine, ecran:nomEcran, onglet };
  etat.deroules.add(idDomaine);
  etat.recents = [[idDomaine, nomEcran, onglet], ...etat.recents.filter(r => !(r[0] === idDomaine && r[1] === nomEcran))].slice(0, 6);
  rendre();
}
function allerRacine() { etat.racine = true; etat.courant = null; rendre(); }
function ouvrirTab(tab) { const cible = TAB_VERS_ECRAN[tab]; if (cible) ouvrir(cible[0], cible[1], 0); }

/* ======================= Bandeau de session (SetStatus / FlashSessionStrip) ======================= */
function setStatus(message, isError = false) {
  const bar = document.getElementById("session-bar");
  document.getElementById("session-msg").textContent = message;
  bar.classList.toggle("erreur", isError);
  bar.classList.remove("flash"); void bar.offsetWidth; bar.classList.add("flash");
}

/* ======================= Rendu : barre laterale (identique au shell) ======================= */
function rendreSidebar() {
  const aside = document.getElementById("sidebar");
  const ligneDomaine = d => {
    const ouvrables = d.ecrans.filter(e => detient(e.perm));
    if (ouvrables.length === 0) return "";
    const deroule = etat.deroules.has(d.id);
    const point = d.maturite === "TechnicalPreview" ? `<span class="point preview" role="img" aria-label="Aperçu technique" title="Aperçu technique"></span>` : "<span></span>";
    return `<div class="domaine">
      <button type="button" class="dom-tete" aria-expanded="${deroule}" data-toggle="${d.id}" aria-label="Domaine ${d.nom}, ${ouvrables.length} écran${ouvrables.length > 1 ? "s" : ""}" title="${d.id} · ${d.nom}">
        ${svg(d.cle, "ic thin")}<span class="nom">${d.nom}</span>${point}<span class="compteur">${ouvrables.length}</span>${svg("Chevron", "chevron", "0 0 9 7")}
      </button>
      <div class="ecrans" ${deroule ? "" : "hidden"}>${ouvrables.map(e => {
        const actif = !etat.racine && etat.courant && etat.courant.domaine === d.id && etat.courant.ecran === e.nom;
        return `<button type="button" class="nav-btn" data-open="${d.id}|${e.nom}|0" ${actif ? 'aria-current="page"' : ""} aria-label="Ouvrir ${e.nom}" title="${e.module} › ${e.sousModules[0]}">${e.nom}</button>`; }).join("")}
      </div></div>`;
  };
  aside.innerHTML = `
    <p class="etiquette">Modules</p>
    <button type="button" class="nav-btn" id="btn-racine" ${etat.racine ? 'aria-current="page"' : ""} aria-label="Mon Espace, accueil" title="Mon Espace (Alt+Origine)">${svg("MonEspace")}<span>Mon Espace</span></button>
    <div class="recherche">${svg("Recherche")}<input type="search" placeholder="Rechercher un écran…  (Ctrl+K)" aria-label="Rechercher un écran"></div>
    <div class="domaines">${DOMAINES.filter(d => !d.epingle).map(ligneDomaine).join("")}</div>
    <div class="epingle">${DOMAINES.filter(d => d.epingle).map(ligneDomaine).join("")}</div>`;
  aside.querySelector("#btn-racine").addEventListener("click", allerRacine);
  aside.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.toggle; etat.deroules.has(id) ? etat.deroules.delete(id) : etat.deroules.add(id); rendreSidebar(); }));
}

/* ======================= Rendu : fil d'Ariane (masque sur l'accueil) ======================= */
function rendreAriane() {
  const nav = document.getElementById("ariane");
  if (etat.racine || !etat.courant) { nav.hidden = true; nav.innerHTML = ""; return; }
  const d = domaine(etat.courant.domaine); const e = d.ecrans.find(x => x.nom === etat.courant.ecran);
  const sousModule = e.sousModules[etat.courant.onglet] || e.sousModules[0];
  const sep = svg("Chevron", "sep", "0 0 9 7");
  nav.hidden = false;
  nav.innerHTML = `${svg(d.cle)}<button type="button" data-seg="dom" aria-label="Remonter à ${d.nom}">${d.nom}</button>${sep}
    <button type="button" data-seg="mod" aria-label="Remonter à ${e.module}">${e.module}</button>${sep}
    <span class="courant" aria-current="page">${sousModule}</span>${d.maturite === "TechnicalPreview" ? badge(d.maturite) : ""}`;
  nav.querySelector('[data-seg="dom"]').addEventListener("click", () => { etat.deroules.add(d.id); rendreSidebar(); });
  nav.querySelector('[data-seg="mod"]').addEventListener("click", () => ouvrir(d.id, e.nom, 0));
}

/* ======================= Rendu : portail Mon Espace ======================= */
function tuile(cap, enChargement, enErreur) {
  const ex = cap.ex;
  const d = domaine(cap.ecran[0]); const e = d.ecrans.find(x => x.nom === cap.ecran[1]);
  const ouvrable = e && detient(e.perm);
  const cls = enChargement ? "chargement" : enErreur ? "erreur" : (ouvrable ? "" : "inactif");
  const valeurTexte = enErreur ? "Indisponible" : `${ex.valeur}${ex.unite ? " " + ex.unite : ""}${ex.suffixe ? " " + ex.suffixe : ""}`;
  const label = enChargement ? `${cap.titre}, chargement en cours` : `${cap.titre}, ${valeurTexte}${enErreur ? ", le serveur n'a pas répondu" : ", " + ex.legende}${ex.alerte ? ", " + ex.alerte : ""}${ouvrable ? ", ouvrir " + cap.ecran[1] : ""}`;
  const corps = enErreur
    ? `<div class="valeur">Indisponible</div><div class="legende">Le serveur n'a pas répondu (détail dans le bandeau de session) · <span style="color:var(--secondary);font-weight:600">Réessayer (F5)</span></div>`
    : `<div class="valeur" ${enChargement ? "" : 'aria-live="polite"'}>${ex.valeur}${ex.suffixe ? `<small>${ex.suffixe}</small>` : ""}${ex.unite && typeof ex.valeur === "number" ? `<small>${ex.unite}</small>` : ""}</div>
       <div class="legende">${ex.legende}${ex.alerte ? `<span class="badge soumise">${ex.alerte}</span>` : ""}${ex.statut ? `<span class="badge ${ex.statut[0]}">${ex.statut[1]}</span>` : ""}${cap.maturite ? badge(cap.maturite) : ""}</div>`;
  const source = etat.annotations ? `<div class="source mono">${cap.route} → ${cap.champ}<span class="badge exemple">exemple</span></div>` : "";
  const attrs = `class="carte tuile ${cls}" title="${cap.route} — ${cap.requis.map(g => g.join(" ou ")).join(" + ")}${cap.unite ? " + unité du poste" : ""}" aria-label="${label}" ${enChargement ? 'aria-busy="true"' : ""}`;
  return ouvrable && !enChargement
    ? `<button type="button" ${attrs} data-open="${cap.ecran.join("|")}"><div class="tete">${cap.titre}${svg(cap.icone)}</div>${corps}${source}</button>`
    : `<div ${attrs}><div class="tete">${cap.titre}${svg(cap.icone)}</div>${corps}${source}</div>`;
}

    <h3 id="h-ecrans">Mes écrans <span class="aide">· ${c.nbEcrans} écran${c.nbEcrans > 1 ? "s" : ""} ouvrable${c.nbEcrans > 1 ? "s" : ""} pour votre profil · la barre latérale est repliée sur l'accueil</span></h3>
    <div class="recherche-accueil">${svg("Recherche")}<input id="HomeSearchTextBox" type="search" placeholder="Rechercher un écran…  (Ctrl+K)" aria-label="Rechercher un écran" value="${etat.recherche.replace(/"/g, "&quot;")}">${etat.recherche ? `<button type="button" class="effacer" id="btn-effacer" aria-label="Effacer la recherche">${svg("Croix", "", "0 0 9 9")}</button>` : ""}</div>
    ${!q && recents.length ? `<div class="ecrans-groupe" style="margin-bottom:12px"><span class="dom">${svg("Horloge")}Derniers ouverts <span class="muted">· ce poste${etat.recents.length ? "" : " · exemple"}</span></span>${recents.map(([id, nom, onglet]) => { const d = domaine(id); const e = d.ecrans.find(x => x.nom === nom); return puce(d, e, onglet, e.sousModules[onglet] !== e.nom && e.sousModules.length > 1 ? e.sousModules[onglet] : ""); }).join("")}</div>` : ""}
    <div class="ecrans-groupes">${groupes.map(g => `<div class="ecrans-groupe"><span class="dom">${svg(g.d.cle, "ic thin")}<span class="id">${g.d.id}</span>${g.d.nom}${g.d.maturite === "TechnicalPreview" ? `<span class="point preview" role="img" aria-label="Aperçu technique" title="Aperçu technique"></span>` : ""}</span>${g.ecrans.map(e => puce(g.d, e)).join("")}</div>`).join("")}</div>
    ${groupes.length ? "" : `<div class="etat-vide-inline" aria-live="polite"><div class="titre">Aucun écran ne correspond à « ${etat.recherche.trim()} »</div><div class="indice">Échap efface la recherche. Les 50 modules restent listés dans « Où en est le produit ? ».</div></div>`}
  </section>`;

  /* ---- mon activite ---- */
  const activite = c.activite === "serveur" ? `<section class="section carte activite reveal d2" aria-labelledby="h-activite">
    <h3 id="h-activite">Mon activité <span class="aide">· les 5 dernières traces de votre compte</span>${badge("TechnicalPreview")}</h3>
    ${charg ? `<div class="etat-vide-inline" aria-busy="true"><div class="indice">Chargement du journal…</div></div>` : `<table aria-label="Mon activité"><thead><tr><th>Quand</th><th>Action</th><th>Élément</th><th>Poste</th></tr></thead><tbody>
      <tr><td>02/09/2026 08:12</td><td>Connexion réussie <span class="mono">auth.login.success</span></td><td>—</td><td>${u ? "RECEPTION-02" : "DIRECTION-01"}</td></tr>
      <tr><td>01/09/2026 17:40</td><td>Étape approuvée <span class="mono">approvals.instance.step_approved</span></td><td>OP-2026-118</td><td>DIRECTION-01</td></tr>
      <tr><td>01/09/2026 16:05</td><td>Rapport exécuté <span class="mono">reporting.report.executed</span></td><td>REV-DAILY · 4 unités</td><td>DIRECTION-01</td></tr>
      <tr><td>01/09/2026 09:31</td><td>Connexion réussie <span class="mono">auth.login.success</span></td><td>—</td><td>DIRECTION-01</td></tr>
      <tr><td>31/08/2026 18:02</td><td>Fiche employé consultée <span class="mono">hr.employee.file_read</span></td><td>EMP-0042</td><td>DIRECTION-01</td></tr>
    </tbody></table>`}
    <div class="pied">${etat.annotations ? `<span class="mono">GET /audit?userId={moi}&pageSize=5 · audit.read · heure locale</span><span class="badge exemple">exemple</span>` : ""}<button type="button" class="btn fantome" style="margin-left:auto" data-open="15|Journal d'audit|0">Tout mon journal</button></div>
  </section>` : "";

  /* ---- ou en est le produit ---- */
  const dispo = MODULES.filter(m => m.statut === "Disponible").length, planifies = MODULES.length - dispo;
  const cptDom = { Functional:0, TechnicalPreview:0, Planned:0, ProductionReady:0 }; DOMAINES.forEach(d => cptDom[d.maturite]++);
  const catalogue = etat.catalogueDeplie ? `<div class="catalogue" id="catalogue">
    <div class="filtres"><span class="lib">Statut</span>${[["tous","Tous"],["Disponible","Disponibles"],["Planifie","Planifiés"]].map(([v, l]) => `<button type="button" class="puce compacte" data-filtre="${v}" aria-pressed="${etat.filtreCatalogue === v}">${l}</button>`).join("")}<span class="muted" style="font-size:11.5px;margin-left:8px">Les puces de priorité et le filtre de domaine de l'accueil actuel se replacent ici, inchangés.</span></div>
    ${DOMAINES.map(d => {
      const ms = MODULES.filter(m => m.dom === d.id && (etat.filtreCatalogue === "tous" || m.statut === etat.filtreCatalogue));
      if (!ms.length && etat.filtreCatalogue !== "tous") return "";
      return `<div class="cat-groupe"><h4><span class="id">${d.id}</span>${svg(d.cle, "ic thin")}${d.nom}<span class="compteur">${ms.length} module${ms.length > 1 ? "s" : ""}</span>${badge(d.maturite)}<span class="filet"></span></h4>
        <div class="cartes">${ms.length ? ms.map(m => {
          const verrou = m.perm && !detient(m.perm); const cliquable = m.tab !== null && !verrou;
          const info = verrou ? "Accès non autorisé pour votre profil" : (m.statut === "Planifie" ? "Module planifié : aucun écran encore livré" : `Ouvrir ${m.nom}`);
          return `<button type="button" class="carte-module" ${cliquable ? `data-tab="${m.tab}"` : "disabled"} title="${info}" aria-label="${m.nom}, ${m.statut === "Disponible" ? "Disponible" : "Planifié"}${verrou ? ", accès non autorisé pour votre profil" : ""}">
            <div class="cm-tete"><span class="cm-icone">${svg(d.cle)}</span><span class="cm-prio">${m.prio}</span>${verrou ? svg("Cadenas", "ic cadenas", "0 0 12 12") : ""}</div>
            <div class="cm-titre">${m.nom}</div><div class="cm-desc">${m.desc}</div>
            <span class="badge ${m.statut === "Disponible" ? "dispo" : "planifie"}">${m.statut === "Disponible" ? "Disponible" : "Planifié"}</span></button>`; }).join("")
          : `<div class="muted" style="font-size:12px">Aucun module rattaché : le domaine apparaît quand même, c'est la promesse du catalogue.</div>`}</div></div>`; }).join("")}
  </div>` : "";
  const produit = `<section class="carte produit reveal d2" aria-labelledby="h-produit">
    <div class="produit-tete">
      <h3 id="h-produit">Où en est le produit ?</h3>
      <div class="stat-inline" aria-label="Avancement des 50 modules">
        <span><span class="pt" style="background:var(--prog-available)"></span><b>${dispo}</b> disponibles</span>
        <span><span class="pt" style="background:var(--prog-api)"></span><b>0</b> API prête</span>
        <span><span class="pt" style="background:var(--prog-partial)"></span><b>0</b> partiels</span>
        <span><span class="pt" style="background:var(--prog-planned)"></span><b>${planifies}</b> planifiés</span>
      </div>
      <button type="button" class="btn secondaire" id="btn-catalogue" aria-expanded="${etat.catalogueDeplie}" aria-controls="catalogue">${etat.catalogueDeplie ? "Replier le catalogue" : "Afficher les 50 modules"}</button>
    </div>
    <div class="barre" aria-hidden="true"><span style="flex:${dispo};background:var(--prog-available)"></span><span style="flex:${planifies};background:var(--prog-planned)"></span></div>
    <div class="legende-barre">${Math.round(dispo / MODULES.length * 100)} % du périmètre déjà utilisable · ${dispo} modules disponibles sur ${MODULES.length}, ${planifies} planifiés.
      Domaines : <span class="stat-inline" style="display:inline-flex"><span><span class="pt pt7" style="background:var(--mat-functional-accent)"></span>${cptDom.Functional} fonctionnels</span><span><span class="pt pt7" style="background:var(--mat-preview-accent)"></span>${cptDom.TechnicalPreview} aperçus techniques</span><span><span class="pt pt7" style="background:var(--mat-planned-accent)"></span>${cptDom.Planned} planifiés</span><span><span class="pt pt7" style="background:var(--mat-ready-accent)"></span>${cptDom.ProductionReady} prêt pour la production</span></span> — les deux échelles ne s'additionnent pas.</div>
    ${catalogue}
  </section>`;

  sec.innerHTML = `<div class="portail">
    <div class="exemple-bandeau" role="note">${svg("Info")}<span><b>Maquette :</b> toutes les valeurs sont fictives. Chaque tuile cite la route et le champ serveur dont viendrait son chiffre, et la permission qui la fait apparaître. Une tuile absente = un droit absent ou un service inexistant, jamais un « bientôt ».</span></div>
    ${bandeau}${traiter}${journee}${ecrans}${activite}${produit}
  </div>`;

  /* ---- cablage ---- */
  sec.querySelectorAll("[data-panneau]").forEach(b => b.addEventListener("click", () => { etat.panneau = etat.panneau === b.dataset.panneau ? null : b.dataset.panneau; rendreEcran(); }));
  sec.querySelectorAll("[data-pref-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.prefTheme; rendre(); setStatus("Apparence enregistrée pour ce poste. Les écrans déjà ouverts prendront le nouveau thème au prochain démarrage."); }));
  sec.querySelectorAll("[data-pref-densite]").forEach(b => b.addEventListener("click", () => { etat.densite = b.dataset.prefDensite; rendre(); setStatus(`Densité « ${etat.densite === "compact" ? "Compact" : "Confortable"} » appliquée aux grilles de ce poste.`); }));
  const sec_ = sec.querySelector("#btn-securite"); if (sec_) sec_.addEventListener("click", () => setStatus("Ouvre la boîte « Changer mon mot de passe » existante (ChangePasswordButton) — les autres sessions du compte sont révoquées à la validation."));
  const rf = sec.querySelector("#RefreshHomeButton"); if (rf) rf.addEventListener("click", actualiser);
  const bc = sec.querySelector("#btn-catalogue"); if (bc) bc.addEventListener("click", () => { etat.catalogueDeplie = !etat.catalogueDeplie; rendreEcran(); if (etat.catalogueDeplie) document.getElementById("catalogue")?.scrollIntoView({ behavior:"smooth", block:"start" }); });
  sec.querySelectorAll("[data-filtre]").forEach(b => b.addEventListener("click", () => { etat.filtreCatalogue = b.dataset.filtre; rendreEcran(); }));
  sec.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => ouvrirTab(+b.dataset.tab)));
  const inp = sec.querySelector("#HomeSearchTextBox");
  if (inp) {
    inp.addEventListener("input", () => { const pos = inp.selectionStart; etat.recherche = inp.value; rendreEcran(); const i2 = document.getElementById("HomeSearchTextBox"); i2.focus(); i2.setSelectionRange(pos, pos); });
    inp.addEventListener("keydown", ev => { if (ev.key === "Escape" && etat.recherche) { ev.preventDefault(); etat.recherche = ""; rendreEcran(); document.getElementById("HomeSearchTextBox").focus(); } });
  }
  const eff = sec.querySelector("#btn-effacer"); if (eff) eff.addEventListener("click", () => { etat.recherche = ""; rendreEcran(); document.getElementById("HomeSearchTextBox").focus(); });
}

/* ======================= Actualisation (F5 → RefreshHomeButton) : un RunAsync par tuile, en sequence ======================= */
let minuteur = null;
function actualiser() {
  if (etat.donnees === "chargement") return;
  const retour = etat.donnees;
  etat.donnees = "chargement"; rendre(); setStatus("Actualisation de Mon Espace…");
  clearTimeout(minuteur);
  minuteur = setTimeout(() => { etat.donnees = retour === "erreur" ? "charge" : retour; rendre(); setStatus("Mon Espace actualisé. Compteurs et montants renvoyés par le serveur."); }, 1100);
}

/* ======================= Rendu global ======================= */
function rendre() {
  const prof = PROFILS[etat.profil]; const u = uniteDuPoste();
  document.documentElement.dataset.theme = etat.theme;
  document.documentElement.dataset.densite = etat.densite;
  const app = document.getElementById("app");
  app.classList.toggle("racine", etat.racine && etat.sidebar === "masquee");
  document.getElementById("entete-session").innerHTML = `<span class="pt"></span><b>${prof.utilisateur}</b> · ${prof.login}${u ? " · " + u.code : ""}`;
  document.getElementById("lbl-theme").textContent = etat.theme === "clair" ? "Sombre" : "Clair";
  document.getElementById("progress").classList.toggle("actif", etat.donnees === "chargement");
  document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.setAttribute("aria-pressed", b.dataset.profil === etat.profil));
  document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === etat.theme));
  document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.setAttribute("aria-pressed", b.dataset.unite === etat.unite));
  document.querySelectorAll(".maquette-bar [data-donnees]").forEach(b => b.setAttribute("aria-pressed", b.dataset.donnees === etat.donnees));
  document.querySelectorAll(".maquette-bar [data-sidebar]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sidebar === etat.sidebar));
  document.querySelectorAll(".maquette-bar [data-annot]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.annot === "oui") === etat.annotations));
  rendreSidebar(); rendreAriane(); rendreEcran();
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => { const [id, nom, onglet] = b.dataset.open.split("|"); ouvrir(id, nom, +onglet || 0); }));
}

function appliquerProfil(p) {
  etat.profil = p; etat.deroules.clear(); etat.recents = []; etat.panneau = null; etat.recherche = ""; etat.unite = "defaut";
  allerRacine();
  const prof = PROFILS[p];
  setStatus(etat.donnees === "erreur"
    ? "Erreur : GET /treasury/payment-orders — 503 Service indisponible (exemple). Les autres tuiles sont chargées."
    : `Prêt. Connecté en tant que ${prof.utilisateur} (${prof.roles.join(", ")}).`, etat.donnees === "erreur");
}

/* ======================= Commandes de la maquette ======================= */
const segProfil = document.getElementById("seg-profil");
segProfil.innerHTML = ORDRE_PROFILS.map(k => `<button type="button" data-profil="${k}" aria-pressed="${k === etat.profil}">${PROFILS[k].nom}</button>`).join("");
segProfil.querySelectorAll("[data-profil]").forEach(b => b.addEventListener("click", () => appliquerProfil(b.dataset.profil)));
document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.theme; rendre(); }));
document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.addEventListener("click", () => { etat.unite = b.dataset.unite; rendre(); }));
document.querySelectorAll(".maquette-bar [data-donnees]").forEach(b => b.addEventListener("click", () => {
  etat.donnees = b.dataset.donnees; rendre();
  if (etat.donnees === "erreur") setStatus("Erreur : GET /treasury/payment-orders — 503 Service indisponible (exemple). Les autres tuiles sont chargées.", true);
  else if (etat.donnees === "chargement") setStatus("Chargement de Mon Espace… (un appel par tuile, en séquence)");
  else setStatus(`Prêt. Connecté en tant que ${PROFILS[etat.profil].utilisateur}.`);
}));
document.querySelectorAll(".maquette-bar [data-sidebar]").forEach(b => b.addEventListener("click", () => { etat.sidebar = b.dataset.sidebar; rendre(); }));
document.querySelectorAll(".maquette-bar [data-annot]").forEach(b => b.addEventListener("click", () => { etat.annotations = b.dataset.annot === "oui"; rendre(); }));
document.getElementById("btn-theme").addEventListener("click", () => { etat.theme = etat.theme === "clair" ? "sombre" : "clair"; rendre(); });
document.getElementById("btn-mdp").addEventListener("click", () => setStatus("Ouvre la boîte « Changer mon mot de passe » existante (ChangePasswordButton)."));
document.addEventListener("keydown", ev => {
  if (ev.altKey && ev.key === "Home") { ev.preventDefault(); allerRacine(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === "k") { ev.preventDefault(); (etat.racine ? document.getElementById("HomeSearchTextBox") : document.querySelector("#sidebar input"))?.focus(); }
  if (ev.key === "F5" && etat.racine) { ev.preventDefault(); actualiser(); }
});

appliquerProfil("reception");
</script>
</body>
</html>
