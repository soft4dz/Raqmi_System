<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Accueil « Catalogue vivant » (exploration 4-hybride)</title>
<!--
  Exploration 4-hybride — accueil « Catalogue vivant » (docs/design/accueil/explorations/4-hybride/concept.md).

  Maquette autonome pour VALIDATION HUMAINE : aucune dependance reseau, aucune police externe,
  aucune donnee reelle. Elle reprend cle par cle la palette de RaqmiTheme.xaml / ThemePalette.Sombre,
  l'echelle typographique et les composants de la charte (docs/charte-ui-desktop.md), ainsi que
  le shell de docs/design/maquette-shell.html (en-tete, barre laterale, fil d'Ariane).

  Parti pris : l'accueil reste le catalogue des 50 modules groupes par domaine (le repere des
  utilisateurs actuels), mais les cartes deviennent VIVANTES : un compteur lu sur le serveur, un
  badge d'urgence uniquement quand le serveur qualifie lui-meme la situation, une zone « A traiter »
  en tete qui n'est qu'une projection de ces memes signaux, et une recherche universelle de
  navigation (modules, sous-modules, ecrans).

  TOUTES LES VALEURS CHIFFREES SONT DES EXEMPLES FICTIFS, marquees « ex. » a l'ecran.
  Les permissions des profils sont celles de SecuritySeeder (branche reorg/phase-1) ; le profil
  Reception est un role personnalise a creer (docs/reorganisation/README.md, decision 8).
-->
<style>
  /* ============ Palette : les brushes de RaqmiTheme.xaml / ThemePalette.Sombre ============ */
  :root, [data-theme="clair"] {
    --structure:#071525; --structure-elevated:#0C2135; --header-fg:#FFFFFF; --header-muted:#9FC3DC;
    --app-bg:#F4F7FA; --surface:#FFFFFF; --surface-subtle:#EEF4F8; --surface-hover:#E4EDF4;
    --panel-border:#DCE6EF; --field-border:#7A8FA3; --border-strong:#B9CCDD;
    --text:#0F2337; --text-2:#4A6A87; --text-muted:#5B6C7E; --text-label:#475569; --placeholder:#5C7188;
    --accent:#0AA3AD; --accent-hover:#0DB6C1; --accent-pressed:#088790;
    --accent-action:#07767D; --accent-action-hover:#08838B; --accent-action-fg:#FFFFFF;
    --accent-soft:#E1F4F5; --accent-selection:rgba(10,163,173,.18);
    --primary:#073B78; --secondary:#145CAB; --danger:#C0392B; --danger-soft:#FBECEA; --danger-border:#EFC9C4;
    --focus:#073B78; --focus-on-filled:#FFFFFF; --focus-on-dark:#FFFFFF;
    --disabled-bg:#E5EBF1; --disabled-fg:#576C82; --disabled-border:#DDE5EC;
    --module-active:rgba(10,163,173,.10);
    --row-hover:#F0F6FA; --row-alt:#FAFCFE; --grid-header-fg:#5B7591;
    --shadow:rgba(7,21,37,.07); --shadow-hover:rgba(7,21,37,.20);
    --mat-planned-bg:#E8EEF4; --mat-planned-fg:#46617B; --mat-planned-accent:#7798B5;
    --mat-preview-bg:#FBEBC8; --mat-preview-fg:#8A5A08; --mat-preview-accent:#BF8B16;
    --mat-functional-bg:#DDF2F4; --mat-functional-fg:#096B73; --mat-functional-accent:#0AA3AD;
    --mat-ready-bg:#DCF3E5; --mat-ready-fg:#14713C; --mat-ready-accent:#1F9D57;
    --status-available-bg:#DCF3E5; --status-available-fg:#14713C;
    --status-api-bg:#DDF2F4; --status-api-fg:#096B73;
    --status-partial-bg:#FBEBC8; --status-partial-fg:#8A5A08;
    --status-planned-bg:#E8EEF4; --status-planned-fg:#46617B;
    --progress-available:#1F9D57; --progress-api:#0AA3AD; --progress-partial:#BF8B16; --progress-planned:#7798B5;
    --status-submitted-bg:#FCEFC7; --status-submitted-fg:#92600A;
    --status-validated-bg:#DBF2E3; --status-validated-fg:#187A41;
    --status-rejected-bg:#FBE3E1; --status-rejected-fg:#B3261E;
  }
  [data-theme="sombre"] {
    --structure:#050F1C; --structure-elevated:#0C1B2B; --header-fg:#EAF2F9; --header-muted:#8FB0CA;
    --app-bg:#0E1826; --surface:#152233; --surface-subtle:#1B2B3E; --surface-hover:#22344A;
    --panel-border:#26374D; --field-border:#62748D; --border-strong:#4B6E93;
    --text:#E6EEF7; --text-2:#AFC3D6; --text-muted:#98AFC6; --text-label:#C2D2E1; --placeholder:#8DA4BC;
    --accent:#22C4CE; --accent-hover:#3ED5DE; --accent-pressed:#16A8B1;
    --accent-action:#2FCBD6; --accent-action-hover:#4CDAE3; --accent-action-fg:#062227;
    --accent-soft:#0E3B40; --accent-selection:rgba(34,196,206,.24);
    --primary:#5B9BE8; --secondary:#6FAEF0; --danger:#F4776A; --danger-soft:#3A1A17; --danger-border:#5E2D28;
    --focus:#7FB6F5; --focus-on-filled:#08222A; --focus-on-dark:#EAF2F9;
    --disabled-bg:#1C2938; --disabled-fg:#8195AB; --disabled-border:#26374D;
    --module-active:rgba(34,196,206,.15);
    --row-hover:#1B2B3E; --row-alt:#182637; --grid-header-fg:#9CB3C9;
    --shadow:rgba(0,0,0,.35); --shadow-hover:rgba(0,0,0,.55);
    --mat-planned-bg:#212F3F; --mat-planned-fg:#A8BCD0; --mat-planned-accent:#506D91;
    --mat-preview-bg:#3A2D12; --mat-preview-fg:#EFC15C; --mat-preview-accent:#E5B23A;
    --mat-functional-bg:#0E3439; --mat-functional-fg:#4FD3DC; --mat-functional-accent:#22C4CE;
    --mat-ready-bg:#11321F; --mat-ready-fg:#68D397; --mat-ready-accent:#3FBF74;
    --status-available-bg:#11321F; --status-available-fg:#68D397;
    --status-api-bg:#0E3439; --status-api-fg:#4FD3DC;
    --status-partial-bg:#3A2D12; --status-partial-fg:#EFC15C;
    --status-planned-bg:#212F3F; --status-planned-fg:#A8BCD0;
    --progress-available:#3FBF74; --progress-api:#22C4CE; --progress-partial:#E5B23A; --progress-planned:#506D91;
    --status-submitted-bg:#3B2E11; --status-submitted-fg:#F5C761;
    --status-validated-bg:#11321F; --status-validated-fg:#68D397;
    --status-rejected-bg:#3A1A19; --status-rejected-fg:#F58C82;
  }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: Manrope, "Noto Kufi Arabic", "Segoe UI", sans-serif;
    font-size:13px; color:var(--text); background:var(--app-bg);
    display:flex; flex-direction:column; min-height:100vh;
  }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:disabled { cursor:default; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.thin { stroke-width:1.4; }
  sup.ex { font-size:9px; font-weight:600; color:var(--mat-preview-fg); background:var(--mat-preview-bg); border-radius:6px; padding:0 4px; margin-left:4px; vertical-align:top; line-height:12px; cursor:help; }

  /* ============ Barre de la maquette (hors produit) ============ */
  .maquette-bar {
    background:var(--structure-elevated); color:var(--header-fg); font-size:12px;
    padding:8px 24px; display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .maquette-bar strong { color:var(--header-muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; font-size:10.5px; }
  .maquette-bar .grp { display:flex; align-items:center; gap:6px; }
  .maquette-bar .seg { display:inline-flex; border:1px solid rgba(255,255,255,.22); border-radius:15px; overflow:hidden; }
  .maquette-bar .seg button { padding:5px 11px; color:var(--header-fg); font-weight:600; font-size:12px; }
  .maquette-bar .seg button[aria-pressed="true"] { background:var(--accent); color:#062227; }
  .maquette-bar .note { margin-left:auto; color:var(--header-muted); }

  /* ============ En-tete ============ */
  header.entete { height:76px; background:var(--structure); color:var(--header-fg); display:flex; align-items:center; padding:0 24px; gap:12px; }
  .marque { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-weight:600; font-size:20px; color:var(--header-fg); }
  .entete h1 { font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .entete .signature { font-size:12px; color:var(--header-muted); }
  .entete .session { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--header-muted); }
  .entete .session b { color:var(--header-fg); font-weight:600; }
  .entete .ghost { border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; color:var(--header-fg); font-size:12px; display:inline-flex; gap:8px; align-items:center; }
  .entete .ghost:focus-visible { outline-color:var(--focus-on-dark); }

  /* ============ Corps : barre laterale + contenu + bandeau de session ============ */
  .app { flex:1; display:grid; grid-template-columns:248px 1fr; grid-template-rows:1fr auto; gap:0 20px; padding:24px; min-height:0; }
  .app.racine { grid-template-columns:1fr; }
  .app.racine aside { display:none; }
  .carte { background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; }
  aside { padding:18px 14px; display:flex; flex-direction:column; min-height:0; }
  .etiquette { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px 14px; }
  .nav-btn { width:100%; height:40px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-radius:6px; color:var(--text-2); font-size:13px; text-align:left; position:relative; }
  .nav-btn:hover { background:var(--surface-subtle); }
  .nav-btn[aria-current="page"] { background:var(--module-active); color:var(--text); font-weight:600; }
  .nav-btn[aria-current="page"]::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:1.5px; background:var(--accent); }
  .recherche { position:relative; margin-top:12px; }
  .recherche input { width:100%; min-height:34px; padding:0 32px; border:1px solid var(--field-border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche input::placeholder { color:var(--placeholder); }
  .recherche svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--placeholder); }
  .domaines { margin-top:14px; overflow:auto; flex:1; padding-right:4px; }
  .domaine { margin-bottom:2px; }
  .dom-tete { width:100%; height:36px; display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; padding:0 10px; border-radius:6px; color:var(--text); font-size:12.5px; font-weight:600; text-align:left; }
  .dom-tete:hover { background:var(--surface-subtle); }
  .dom-tete svg.ic { color:var(--text-muted); margin-right:10px; }
  .dom-tete .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom-tete .compteur { background:var(--surface-subtle); color:var(--text-2); font-size:10.5px; font-weight:400; border-radius:8px; padding:1px 7px; margin-left:8px; }
  .dom-tete .chevron { width:9px; height:7px; margin-left:8px; color:var(--text-muted); transition:transform .12s; transform:rotate(-90deg); }
  .dom-tete[aria-expanded="true"] .chevron { transform:rotate(0); }
  .point { width:7px; height:7px; border-radius:50%; margin-left:8px; display:inline-block; }
  .point.preview { background:var(--mat-preview-accent); }
  .ecrans { margin:2px 0 8px; }
  .ecrans .nav-btn { height:34px; margin-left:8px; width:calc(100% - 8px); font-size:12.5px; margin-bottom:2px; }
  .epingle { border-top:1px solid var(--panel-border); margin-top:10px; padding-top:8px; }
  .epingle:empty { display:none; }
  .session-bar { grid-column:1 / -1; margin-top:14px; border-top:1px solid var(--panel-border); padding:10px 8px 0; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); }
  .session-bar .etiquette { margin:0 4px 0 0; }
  .session-bar .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .session-bar.flash { animation: flash .9s ease-out; }
  @keyframes flash { 0% { background:var(--accent-soft);} 100% { background:transparent; } }
  .busy { height:4px; background:var(--surface-hover); overflow:hidden; border-radius:2px; margin:0 8px; grid-column:1 / -1; visibility:hidden; }
  .busy.actif { visibility:visible; }
  .busy::after { content:""; display:block; width:30%; height:100%; background:var(--accent-action); animation: ind 1.1s infinite linear; }
  @keyframes ind { 0% { transform:translateX(-100%);} 100% { transform:translateX(340%);} }

  /* ============ Fil d'Ariane ============ */
  .ariane { height:32px; display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:12px; }
  .ariane[hidden] { display:none; }
  .ariane svg.ic { color:var(--text-2); }
  .ariane button { color:var(--text-2); font-weight:600; padding:3px 6px; border-radius:5px; }
  .ariane button:hover { background:var(--surface-subtle); color:var(--text); }
  .ariane .courant { color:var(--text); font-weight:600; padding:3px 6px; }
  .ariane .sep { width:9px; height:7px; color:var(--text-muted); transform:rotate(-90deg); }
  .ariane .badge { margin-left:auto; }
  .ariane .note-ariane { margin-left:auto; font-size:11px; color:var(--text-muted); }

  /* ============ Badges ============ */
  .badge { display:inline-flex; align-items:center; border-radius:9px; padding:2.5px 9px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .badge.planned { background:var(--mat-planned-bg); color:var(--mat-planned-fg); }
  .badge.preview { background:var(--mat-preview-bg); color:var(--mat-preview-fg); }
  .badge.functional { background:var(--mat-functional-bg); color:var(--mat-functional-fg); }
  .badge.ready { background:var(--mat-ready-bg); color:var(--mat-ready-fg); }
  .badge.dispo { background:var(--status-available-bg); color:var(--status-available-fg); }
  .badge.api { background:var(--status-api-bg); color:var(--status-api-fg); }
  .badge.partiel { background:var(--status-partial-bg); color:var(--status-partial-fg); }
  .badge.planifie { background:var(--status-planned-bg); color:var(--status-planned-fg); }
  .badge.soumise { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .badge.validee { background:var(--status-validated-bg); color:var(--status-validated-fg); }

  /* ============ Boutons de la charte ============ */
  .btn { min-height:36px; padding:7px 15px; border-radius:6px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px; }
  .btn.secondaire { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); }
  .btn.secondaire:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .btn.primaire { background:var(--accent-action); color:var(--accent-action-fg); padding:7px 18px; }
  .btn.primaire:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .btn.fantome { min-height:34px; padding:6px 12px; color:var(--secondary); }
  .btn.fantome:hover { background:var(--surface-subtle); }
  .btn.petit { min-height:30px; padding:4px 11px; font-size:12px; }

  /* ============ Accueil « Catalogue vivant » ============ */
  main { min-width:0; display:flex; flex-direction:column; }
  .accueil { display:flex; flex-direction:column; gap:16px; }
  .section-titre { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 12px; }

  /* Bandeau : salutation + date + liens compte a gauche, recherche universelle a droite */
  .bandeau { padding:18px 22px 14px; display:grid; grid-template-columns:1fr auto; gap:12px 24px; align-items:start; }
  .bandeau h2 { font-size:26px; font-weight:600; margin:0; line-height:1.15; }
  .bandeau .date { font-size:13px; color:var(--text-2); margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
  .bandeau .date .sep { color:var(--text-muted); }
  .bandeau .liens { display:flex; gap:2px; margin:6px 0 0 -12px; flex-wrap:wrap; }
  .recherche-u { position:relative; width:420px; max-width:100%; justify-self:end; }
  .recherche-u input { width:100%; min-height:36px; padding:0 34px; border:1px solid var(--field-border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche-u input::placeholder { color:var(--placeholder); }
  .recherche-u input:hover { border-color:var(--border-strong); }
  .recherche-u svg.loupe { position:absolute; left:11px; top:18px; transform:translateY(-50%); color:var(--placeholder); }
  .recherche-u .effacer { position:absolute; right:7px; top:7px; width:22px; height:22px; border-radius:11px; display:grid; place-items:center; color:var(--text-2); }
  .recherche-u .effacer:hover { background:var(--surface-subtle); }
  .recherche-u .effacer svg { width:9px; height:9px; stroke-width:1.6; }
  .recherche-u .aide { font-size:11.5px; color:var(--text-muted); margin-top:6px; text-align:right; }

  /* A traiter */
  .a-traiter { padding:14px 18px 12px; position:relative; }
  .a-traiter .tete { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .a-traiter .tete .section-titre { margin:0; }
  .a-traiter .maj { margin-left:auto; font-size:11.5px; color:var(--text-muted); }
  .items { display:flex; flex-wrap:wrap; gap:8px; min-height:40px; }
  .item { display:inline-flex; align-items:center; gap:9px; min-height:40px; padding:6px 12px 6px 12px; border:1px solid var(--panel-border); border-radius:8px; background:var(--surface); color:var(--text); font-size:12.5px; text-align:left; position:relative; overflow:hidden; }
  .item:hover { border-color:var(--accent); background:var(--surface); }
  .item:focus-visible { border-color:var(--focus); }
  .item svg.ic { color:var(--accent-pressed); }
  .item b { font-weight:600; }
  .item .mod { color:var(--text-muted); }
  .item.urgent { padding-left:14px; }
  .item.urgent::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--status-submitted-fg); }
  .item.urgent svg.ic { color:var(--status-submitted-fg); }
  .item .badge { margin-left:2px; }
  .squelette { display:inline-block; height:12px; width:140px; border-radius:6px; background:linear-gradient(90deg, var(--surface-subtle) 25%, var(--surface-hover) 50%, var(--surface-subtle) 75%); background-size:200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  .item.squelette-item { pointer-events:none; }
  .vide-inline { display:flex; align-items:center; gap:14px; padding:6px 4px; pointer-events:none; }
  .vide-inline svg { width:28px; height:28px; stroke-width:1.3; color:var(--text-muted); }
  .vide-inline .titre { font-size:14px; font-weight:600; color:var(--text-2); }
  .vide-inline .indice { font-size:12px; color:var(--text-muted); }
  .avertissement { display:flex; align-items:center; gap:10px; margin-top:10px; padding:9px 14px; border-radius:8px; background:var(--status-submitted-bg); border:1px solid var(--status-submitted-fg); color:var(--status-submitted-fg); font-size:13px; font-weight:600; }
  .avertissement button { color:inherit; text-decoration:underline; font-weight:600; margin-left:auto; }

  /* Rail des domaines */
  .rail { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rail .lib { font-size:11px; font-weight:600; color:var(--text-muted); margin-right:6px; }
  .rail button { height:30px; padding:0 9px 0 8px; border-radius:15px; border:1px solid var(--panel-border); background:var(--surface); display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--text-2); }
  .rail button:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .rail button[aria-pressed="true"] { background:var(--accent-action); border-color:var(--accent-action); color:var(--accent-action-fg); }
  .rail button[aria-pressed="true"]:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .rail button .id { font-variant-numeric:tabular-nums; }
  .rail button .nb { font-weight:400; opacity:.85; }
  .rail button .nom { display:none; }
  .rail button[aria-pressed="true"] .nom { display:inline; font-weight:600; }

  /* Filtres + avancement compact */
  .ligne-filtres { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  .groupe-puces { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .groupe-puces .lib { font-size:11px; font-weight:600; color:var(--text-muted); margin-right:2px; }
  .puce-c { padding:4px 11px; border-radius:15px; border:1px solid var(--panel-border); background:var(--surface); font-size:11.5px; font-weight:600; color:var(--text-2); }
  .puce-c:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .puce-c[aria-pressed="true"] { background:var(--accent-action); border-color:var(--accent-action); color:var(--accent-action-fg); }
  .puce-c[aria-pressed="true"]:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .avancement-c { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:9px 14px; background:var(--surface-subtle); border:1px solid var(--panel-border); border-radius:8px; font-size:12.5px; color:var(--text-2); }
  .avancement-c .titre { font-size:11px; font-weight:600; color:var(--text-muted); }
  .avancement-c b { color:var(--text); font-weight:600; }

  domaine:null, statut:"", prio:"", maturite:"", recherche:"", detail:false,
  ecran:null, deroules:new Set(), rechargement:false, horodatage:"08:12",
};
const prof = () => PROFILS[etat.profil];
const has = k => prof().tout || prof().permissions.includes(k);
const uniteDuPoste = () => etat.uniteMode === "definie" ? "HTL-01 · Alger centre" : etat.uniteMode === "absente" ? null : prof().unite;
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* ======================= Composeur (HomeComposer.Compose : fonction pure permissions × registre) ======================= */
function composer() {
  const slots = new Map();
  for (const s of SIGNAUX) {
    const carte = module_(s.ordre);
    let etatSlot, variante = null;
    if (!has(carte.perm)) etatSlot = "verrouille";                 // la carte est cadenassee : aucun appel
    else if (!has(s.perm)) etatSlot = "cache";                      // la route n'est pas ouverte au profil : rien
    else if (s.portee === "unite" && !uniteDuPoste()) etatSlot = "sansUnite";
    else { etatSlot = "pret"; variante = s.variantes ? s.variantes.find(v => !v.si || has(v.si)) : s; }
    slots.set(s.ordre, { s, etat:etatSlot, variante });
  }
  return slots;
}
function lire(slot) {
  if (slot.etat !== "pret") return null;
  if (etat.sim === "chargement" || etat.rechargement) return { etat:"chargement" };
  if (etat.sim === "erreur" && ["frontdesk","cockpit","tresorerie","rh"].includes(slot.s.id)) return { etat:"erreur" };
  const v = etat.sim === "vide" ? slot.variante.zero : slot.variante.ex;
  const r = slot.variante.rendu(v, has);
  return { etat:"valeur", texte:r.texte, travail:!!r.travail, urgent:!!r.urgent };
}

/* ======================= Navigation (un seul chemin : NavigateToModule) ======================= */
function ouvrirOnglet(tab, nom) {
  const m = MODULES.find(x => x.tab === tab && x.n === nom) || MODULES.find(x => x.tab === tab);
  if (!m || !has(m.perm)) { statut(`« ${nom || m?.n} » n'est pas ouvert à votre profil.`, true); return; }
  etat.ecran = { tab, nom:m.n, dom:m.dom, mod:m.mod };
  etat.deroules.add(m.dom);
  rendre();
  statut(`NavigateToModule(${tab}) → ${m.n}.`);
}
function allerRacine() { etat.ecran = null; rendre(); }
function statut(msg, erreur = false) {
  const bar = document.getElementById("session-bar"); const txt = document.getElementById("statut");
  txt.textContent = msg; txt.style.color = erreur ? "var(--danger)" : ""; bar.querySelector(".dot").style.background = erreur ? "var(--danger)" : "var(--accent)";
  bar.classList.remove("flash"); void bar.offsetWidth; bar.classList.add("flash");
}
function actualiser() {
  if (etat.rechargement) return;
  etat.rechargement = true; document.getElementById("busy").classList.add("actif"); rendre();
  setTimeout(() => {
    etat.rechargement = false; document.getElementById("busy").classList.remove("actif");
    const n = [...composer().values()].filter(x => x.etat === "pret").length;
    etat.horodatage = "08:14"; rendre();
    statut(`Accueil actualisé : ${n} compteur${n > 1 ? "s" : ""} lu${n > 1 ? "s" : ""} en 0,6 s (exemple).`);
  }, 900);
}

  </div>`;

  /* --- Résultats de recherche : sous-modules et écrans (nœuds qui ne sont pas des cartes) --- */
  let resultats = "";
  if (etat.recherche) {
    const q = norm(etat.recherche); const hits = [];

      for (const e of d.ecrans) for (const sm of e.sousModules) if (norm(`${sm} ${e.module} ${e.nom}`).includes(q)) hits.push({ d, e, sm, ouvrable:has(e.perm) });
      for (const [mod, sm] of d.planifies) if (norm(`${sm} ${mod}`).includes(q)) hits.push({ d, sm, mod, planifie:true });

  /* --- Catalogue vivant : 50 cartes groupées par domaine 01…22 --- */
  const visibles = MODULES.filter(filtreCarte);
  let catalogue = "";
  for (const d of DOMAINES) {
    if (etat.domaine && d.id !== etat.domaine) continue;
    const cartes = visibles.filter(m => m.dom === d.id);
    if (!cartes.length) { if (d.id === "19" && !etat.recherche && !etat.statut && !etat.prio && !etat.maturite) catalogue += `<div class="groupe-tete">${svg(d.cle, "ic thin")}<span class="nom"><span class="id">${d.id}</span>${d.nom}</span><span class="compteur">0 module</span>${badgeMat(d.maturite)}<span class="filet"></span></div><div class="catalogue-vide" style="margin-bottom:14px">Aucun module rattaché : c'est la promesse du catalogue, le domaine existe avant son premier écran.</div>`; continue; }
    catalogue += `<div class="groupe-tete" role="heading" aria-level="3" aria-label="Domaine ${d.id} ${d.nom}, ${cartes.length} module${cartes.length > 1 ? "s" : ""}, ${MATURITE[d.maturite].libelle}">${svg(d.cle, "ic thin")}<span class="nom"><span class="id">${d.id}</span>${d.nom}</span><span class="compteur">${cartes.length} module${cartes.length > 1 ? "s" : ""}</span>${badgeMat(d.maturite)}<span class="filet"></span></div>
      <div class="cartes">${cartes.map(m => {
        const verrou = m.perm && !has(m.perm); const planifie = m.s === "planifie"; const cliquable = m.tab && !verrou;
        const [sc, sl] = STATUT[m.s]; const slot = slots.get(m.o); const l = slot ? lectures.get(m.o) : null;
        const nomA = verrou ? `${m.n}, accès non autorisé pour votre profil` : planifie ? `${m.n}, planifié` : `Ouvrir ${m.n}, ${sl}${l && l.etat === "valeur" ? `, ${l.texte}` : ""}`;
        const tip = verrou ? "Accès non autorisé pour votre profil" : planifie ? "Module planifié : aucun écran encore livré" : `${d.id} · ${d.nom} → ${m.mod}`;
        return `<button type="button" class="cm ${m.s === "dispo" && !verrou ? "dispo" : ""} ${verrou ? "verrou" : ""}" ${cliquable ? `data-open="${m.tab}|${m.n}"` : "disabled"} aria-label="${nomA}" title="${tip}">
          <div class="tete"><span class="chip">${svg(d.cle)}</span><span class="droite">${verrou ? svg("Cadenas", "ic cadenas", "0 0 12 12") : ""}${m.p}</span></div>
          <div class="titre">${m.n}</div>
          <div class="desc">${m.d}</div>
          ${verrou ? `<div class="signal" aria-hidden="true"></div>` : rendreSignal(slot, l, m)}
          <div class="bas"><span class="badge ${sc}">${sl}</span><span class="mod" title="${m.mod}">${m.mod}</span></div>
        </button>`; }).join("")}</div>`;
  }
  if (!visibles.length) catalogue = `<div class="catalogue-vide"><b>Aucun module ne correspond à ${etat.recherche ? `« ${etat.recherche} »` : "ce filtre"}</b>${etat.recherche ? "Échap efface la recherche." : "Élargissez le statut, la priorité, la maturité ou le domaine."}</div>`;

  sec.innerHTML = `<div class="accueil">${bandeau}${aTraiter}${rail}${filtres}${resultats}<div>${catalogue}</div></div>`;

  /* --- Câblage --- */
  const inp = sec.querySelector("#recherche");
  inp.addEventListener("input", () => { etat.recherche = inp.value; const pos = inp.selectionStart; rendreAccueil(sec); const i2 = sec.querySelector("#recherche"); i2.focus(); i2.setSelectionRange(pos, pos); });
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { ev.preventDefault(); etat.recherche = ""; rendreAccueil(sec); sec.querySelector("#recherche").focus(); }
    if (ev.key === "Enter") { const first = sec.querySelector(".res[data-open]:not(:disabled), .cm[data-open]"); if (first) { const [tab, nom] = first.dataset.open.split("|"); ouvrirOnglet(+tab, nom); } }
  });
  sec.querySelector("#effacer").addEventListener("click", () => { etat.recherche = ""; rendreAccueil(sec); sec.querySelector("#recherche").focus(); });
  sec.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => { const [tab, nom] = b.dataset.open.split("|"); ouvrirOnglet(+tab, nom); }));
  sec.querySelectorAll("[data-dom]").forEach(b => b.addEventListener("click", () => { etat.domaine = b.dataset.dom || null; rendreAccueil(sec); }));
  sec.querySelectorAll("[data-statut]").forEach(b => b.addEventListener("click", () => { etat.statut = b.dataset.statut; rendreAccueil(sec); }));
  sec.querySelectorAll("[data-prio]").forEach(b => b.addEventListener("click", () => { etat.prio = b.dataset.prio; rendreAccueil(sec); }));
  sec.querySelectorAll("[data-mat]").forEach(b => b.addEventListener("click", () => { etat.maturite = b.dataset.mat; rendreAccueil(sec); }));
  sec.querySelector("#detail").addEventListener("click", () => { etat.detail = !etat.detail; rendreAccueil(sec); });
  sec.querySelector("#RefreshHomeSignalsButton").addEventListener("click", actualiser);
  sec.querySelector("#reessayer")?.addEventListener("click", actualiser);
}

/* ======================= Rendu : ecran ouvert (hors perimetre de la maquette) ======================= */
function rendreEcranOuvert(sec) {
  const e = etat.ecran; const d = domaine(e.dom);
  sec.innerHTML = `<div class="carte ecran">
    <div class="ecran-tete"><h2>${e.nom}</h2><div class="sous">${d.nom} → ${e.mod} — onglet ${e.tab} de MainTabs, vue inchangée.</div></div>
    <div class="grille"><div class="vide">${svg("Corbeille")}<div class="titre">Écran hors périmètre de cette maquette</div><div class="indice">Cette exploration ne porte que sur l'accueil. Alt+Origine ou « Mon Espace » dans la barre latérale pour y revenir.</div></div></div>
  </div>`;
}

/* ======================= Rendu global ======================= */
function rendre() {
  const p = prof();
  document.documentElement.dataset.theme = etat.theme;
  document.getElementById("app").classList.toggle("racine", etat.shell !== "visible" && !etat.ecran);
  document.getElementById("entete-session").innerHTML = `<b>${p.utilisateur}</b> · ${p.nom}${uniteDuPoste() ? " · " + uniteDuPoste() : ""}`;
  document.getElementById("lbl-theme").textContent = etat.theme === "clair" ? "Sombre" : "Clair";
  document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.setAttribute("aria-pressed", b.dataset.profil === etat.profil));
  document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === etat.theme));
  document.querySelectorAll(".maquette-bar [data-shell]").forEach(b => b.setAttribute("aria-pressed", b.dataset.shell === etat.shell));
  document.querySelectorAll(".maquette-bar [data-sim]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sim === etat.sim));
  document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.setAttribute("aria-pressed", b.dataset.unite === etat.uniteMode));
  rendreSidebar(); rendreAriane();
  const sec = document.getElementById("ecran");
  if (etat.ecran) rendreEcranOuvert(sec); else rendreAccueil(sec);
}

/* ======================= Commandes de la maquette et raccourcis ======================= */
document.getElementById("seg-profil").innerHTML = ORDRE_PROFILS.map(k => `<button type="button" data-profil="${k}" aria-pressed="${k === etat.profil}">${PROFILS[k].nom}</button>`).join("");
document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.addEventListener("click", () => { etat.profil = b.dataset.profil; etat.ecran = null; etat.deroules.clear(); etat.recherche = ""; etat.domaine = null; rendre(); statut(`Prêt. Connecté en tant que ${prof().utilisateur} (${prof().role}).`); }));
document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.theme; rendre(); }));
document.querySelectorAll(".maquette-bar [data-shell]").forEach(b => b.addEventListener("click", () => { etat.shell = b.dataset.shell; rendre(); }));
document.querySelectorAll(".maquette-bar [data-sim]").forEach(b => b.addEventListener("click", () => { etat.sim = b.dataset.sim; rendre(); }));
document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.addEventListener("click", () => { etat.uniteMode = b.dataset.unite; rendre(); }));
document.getElementById("btn-theme").addEventListener("click", () => { etat.theme = etat.theme === "clair" ? "sombre" : "clair"; rendre(); statut("Apparence changée pour ce poste. Les écrans déjà ouverts prendront le nouveau thème au prochain démarrage."); });
document.addEventListener("keydown", ev => {
  if (ev.altKey && ev.key === "Home") { ev.preventDefault(); allerRacine(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === "k") { ev.preventDefault(); const i = etat.ecran ? document.querySelector("#sidebar input") : document.querySelector("#recherche"); i?.focus(); i?.select(); }
  if (ev.key === "F5") { ev.preventDefault(); if (!etat.ecran) { if ([...composer().values()].some(x => x.etat === "pret")) actualiser(); else statut("Cet écran n'a rien à actualiser."); } else statut("Cet écran n'a rien à actualiser (maquette)."); }
});

rendre();
statut(`Prêt. Connecté en tant que ${prof().utilisateur} (${prof().role}).`);
</script>
</body>
</html>
