<!doctype html>
<html lang="fr" data-theme="clair" data-densite="confortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Accueil « Cockpit » (exploration 2)</title>
<!--
  Maquette autonome de l'exploration 2 « Cockpit » (docs/design/accueil/explorations/2-cockpit/concept.md).
  Aucune dependance reseau, aucune police externe, aucune donnee reelle : tout chiffre affiche est un
  EXEMPLE, annote comme tel, et cite la route API et la permission qui l'alimenteraient.

  Ce qu'elle montre : le shell (en-tete 76 px, barre laterale 248 px deployee autour du cockpit -
  parti pris du concept, une condition de SyncSidebarToTab - et fil d'Ariane masque a la racine comme
  aujourd'hui) autour de l'onglet 0 refondu en cockpit ; sept profils commutables composes a partir
  des PERMISSIONS du SecuritySeeder (jamais d'un role code en dur) ; les deux themes de ThemePalette ;
  les deux densites ; les etats chargement / erreur / vide / a la demande / sans unite ; le catalogue
  des 50 modules conserve, replie en pied de page (Ctrl+K l'ouvre).
-->
<style>
  /* ============ Palette : brushes de RaqmiTheme.xaml / ThemePalette.Sombre, clef par clef ============ */
  :root, [data-theme="clair"] {
    --structure:#071525; --structure-elevated:#0C2135; --header-fg:#FFFFFF; --header-muted:#9FC3DC;
    --app-bg:#F4F7FA; --surface:#FFFFFF; --surface-subtle:#EEF4F8; --surface-hover:#E4EDF4;
    --panel-border:#DCE6EF; --field-border:#7A8FA3; --border-strong:#B9CCDD;
    --text:#0F2337; --text-2:#4A6A87; --text-muted:#5B6C7E; --text-label:#475569; --placeholder:#5C7188;
    --accent:#0AA3AD; --accent-hover:#0DB6C1; --accent-pressed:#088790;
    --accent-action:#07767D; --accent-action-hover:#08838B; --accent-action-fg:#FFFFFF;
    --accent-soft:#E1F4F5; --accent-selection:rgba(10,163,173,.18);
    --primary:#073B78; --secondary:#145CAB; --danger:#C0392B; --danger-soft:#FBECEA; --danger-border:#EFC9C4;
    --focus:#073B78; --focus-on-filled:#FFFFFF; --focus-on-dark:#FFFFFF;
    --disabled-bg:#E5EBF1; --disabled-fg:#576C82;
    --module-active:rgba(10,163,173,.10);
    --row-hover:#F0F6FA; --row-alt:#FAFCFE; --grid-header-fg:#5B7591;
    --shadow:rgba(7,21,37,.07); --shadow-hover:rgba(7,21,37,.20);
    --mat-planned-bg:#E8EEF4; --mat-planned-fg:#46617B; --mat-planned-accent:#7798B5;
    --mat-preview-bg:#FBEBC8; --mat-preview-fg:#8A5A08; --mat-preview-accent:#BF8B16;
    --mat-functional-bg:#DDF2F4; --mat-functional-fg:#096B73; --mat-functional-accent:#0AA3AD;
    --mat-ready-bg:#DCF3E5; --mat-ready-fg:#14713C; --mat-ready-accent:#1F9D57;
    --status-draft-bg:#E2E8F0; --status-draft-fg:#475569;
    --status-submitted-bg:#FCEFC7; --status-submitted-fg:#92600A;
    --status-validated-bg:#DBF2E3; --status-validated-fg:#187A41;
    --status-rejected-bg:#FBE3E1; --status-rejected-fg:#B3261E;
    --status-available-bg:#DCF3E5; --status-available-fg:#14713C;
    --status-planned-bg:#E8EEF4; --status-planned-fg:#46617B;
    --progress-available:#1F9D57; --progress-api:#0AA3AD; --progress-partial:#BF8B16; --progress-planned:#7798B5;
  }
  [data-theme="sombre"] {
    --structure:#050F1C; --structure-elevated:#0C1B2B; --header-fg:#EAF2F9; --header-muted:#8FB0CA;
    --app-bg:#0E1826; --surface:#152233; --surface-subtle:#1B2B3E; --surface-hover:#22344A;
    --panel-border:#26374D; --field-border:#62748D; --border-strong:#4B6E93;
    --text:#E6EEF7; --text-2:#AFC3D6; --text-muted:#98AFC6; --text-label:#C2D2E1; --placeholder:#8DA4BC;
    --accent:#22C4CE; --accent-hover:#3ED5DE; --accent-pressed:#16A8B1;
    --accent-action:#2FCBD6; --accent-action-hover:#4CDAE3; --accent-action-fg:#062227;
    --accent-soft:#0E3B40; --accent-selection:rgba(34,196,206,.24);
    --primary:#5B9BE8; --secondary:#6FAEF0; --danger:#F4776A; --danger-soft:#3A1A17; --danger-border:#5E2D28;
    --focus:#7FB6F5; --focus-on-filled:#08222A; --focus-on-dark:#EAF2F9;
    --disabled-bg:#1C2938; --disabled-fg:#8195AB;
    --module-active:rgba(34,196,206,.15);
    --row-hover:#1B2B3E; --row-alt:#182637; --grid-header-fg:#9CB3C9;
    --shadow:rgba(0,0,0,.35); --shadow-hover:rgba(0,0,0,.55);
    --mat-planned-bg:#212F3F; --mat-planned-fg:#A8BCD0; --mat-planned-accent:#506D91;
    --mat-preview-bg:#3A2D12; --mat-preview-fg:#EFC15C; --mat-preview-accent:#E5B23A;
    --mat-functional-bg:#0E3439; --mat-functional-fg:#4FD3DC; --mat-functional-accent:#22C4CE;
    --mat-ready-bg:#11321F; --mat-ready-fg:#68D397; --mat-ready-accent:#3FBF74;
    --status-draft-bg:#26313E; --status-draft-fg:#C4D0DC;
    --status-submitted-bg:#3B2E11; --status-submitted-fg:#F5C761;
    --status-validated-bg:#11321F; --status-validated-fg:#68D397;
    --status-rejected-bg:#3A1A19; --status-rejected-fg:#F58C82;
    --status-available-bg:#11321F; --status-available-fg:#68D397;
    --status-planned-bg:#212F3F; --status-planned-fg:#A8BCD0;
    --progress-available:#3FBF74; --progress-api:#22C4CE; --progress-partial:#E5B23A; --progress-planned:#506D91;
  }
  /* Densite : la grille suit GridRowHeight (40/32) ; la tuile suit la ressource proposee CockpitTileHeight (100/84). */
  [data-densite="confortable"] { --tile-h:100px; --row-h:40px; --head-h:40px; --file-h:56px; }
  [data-densite="compact"]     { --tile-h:84px;  --row-h:32px; --head-h:34px; --file-h:46px; }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family: Manrope, "Noto Kufi Arabic", "Segoe UI", sans-serif; font-size:13px; color:var(--text); background:var(--app-bg); display:flex; flex-direction:column; min-height:100vh; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:disabled { cursor:default; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.thin { stroke-width:1.4; }
  .num { font-variant-numeric:tabular-nums; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ============ Barre de la maquette (hors produit) ============ */
  .maquette-bar { background:var(--structure-elevated); color:var(--header-fg); font-size:12px; padding:8px 24px; display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
  .maquette-bar strong { color:var(--header-muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; font-size:10.5px; }
  .maquette-bar .grp { display:flex; align-items:center; gap:6px; }
  .maquette-bar .seg { display:inline-flex; border:1px solid rgba(255,255,255,.22); border-radius:15px; overflow:hidden; }
  .maquette-bar .seg button { padding:5px 11px; color:var(--header-fg); font-weight:600; font-size:12px; }
  .maquette-bar .seg button[aria-pressed="true"] { background:var(--accent); color:#062227; }
  .maquette-bar .note { margin-left:auto; color:var(--header-muted); }

  /* ============ En-tete ============ */
  header.entete { height:76px; background:var(--structure); color:var(--header-fg); display:flex; align-items:center; padding:0 24px; gap:12px; }
  .marque { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-weight:600; font-size:20px; }
  .entete h1 { font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .entete .signature { font-size:12px; color:var(--header-muted); }
  .entete .session { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--header-muted); }
  .entete .session b { color:var(--header-fg); font-weight:600; }
  .entete .session .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px; }
  .entete .ghost { border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; color:var(--header-fg); font-size:12px; display:inline-flex; gap:8px; align-items:center; }
  .entete .ghost:focus-visible { outline-color:var(--focus-on-dark); }

  /* ============ Corps ============ */
  .app { flex:1; display:grid; grid-template-columns:248px 1fr; gap:20px; padding:24px; min-height:0; }
  .app.replie { grid-template-columns:1fr; }
  .app.replie aside { display:none; }
  .carte { background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; }
  .carte-subtile { background:var(--surface-subtle); border-radius:8px; }
  aside { padding:18px 14px; display:flex; flex-direction:column; min-height:0; }
  .etiquette { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px 14px; }
  .nav-btn { width:100%; height:40px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-radius:6px; color:var(--text-2); font-size:13px; text-align:left; position:relative; }
  .nav-btn:hover { background:var(--surface-subtle); }
  .nav-btn[aria-current="page"] { background:var(--module-active); color:var(--text); font-weight:600; }
  .nav-btn[aria-current="page"]::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:1.5px; background:var(--accent); }
  .recherche { position:relative; margin-top:12px; }
  .recherche input { width:100%; min-height:34px; padding:0 32px; border:1px solid var(--field-border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche input::placeholder { color:var(--placeholder); }
  .recherche svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--placeholder); }
  .domaines { margin-top:14px; overflow:auto; flex:1; padding-right:4px; }
  .dom-tete { width:100%; height:36px; display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; padding:0 10px; border-radius:6px; color:var(--text); font-size:12.5px; font-weight:600; text-align:left; }
  .dom-tete:hover { background:var(--surface-subtle); }
  .dom-tete svg.ic { color:var(--text-muted); margin-right:10px; }
  .dom-tete .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom-tete .compteur { background:var(--surface-subtle); color:var(--text-2); font-size:10.5px; font-weight:400; border-radius:8px; padding:1px 7px; margin-left:8px; }
  .dom-tete .chevron { width:9px; height:7px; margin-left:8px; color:var(--text-muted); transform:rotate(-90deg); }
  .point { width:7px; height:7px; border-radius:50%; margin-left:8px; display:inline-block; }
  .point.preview { background:var(--mat-preview-accent); }
  .epingle { border-top:1px solid var(--panel-border); margin-top:10px; padding-top:8px; }
  .session-strip { border-top:1px solid var(--panel-border); margin-top:10px; padding:10px 8px 0; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); }
  .session-strip .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .session-strip.erreur .dot { background:var(--danger); }
  .session-strip .etiquette { margin:0 4px 0 0; }

  /* ============ Fil d'Ariane ============ */
  .ariane { height:32px; display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:12px; }
  .ariane[hidden] { display:none; }
  .ariane svg.ic { color:var(--text-2); }
  .ariane .courant { color:var(--text); font-weight:600; padding:3px 6px; }
  .ariane .seg { color:var(--text-2); font-weight:600; padding:3px 6px; }
  .ariane .sep { width:9px; height:7px; color:var(--text-muted); transform:rotate(-90deg); }
  .ariane .badge { margin-left:auto; }

  /* ============ Badges et pastilles ============ */
  .badge { display:inline-flex; align-items:center; border-radius:9px; padding:2.5px 9px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .badge.planned { background:var(--mat-planned-bg); color:var(--mat-planned-fg); }
  .badge.preview { background:var(--mat-preview-bg); color:var(--mat-preview-fg); }
  .badge.functional { background:var(--mat-functional-bg); color:var(--mat-functional-fg); }
  .badge.ready { background:var(--mat-ready-bg); color:var(--mat-ready-fg); }
  .badge.brouillon { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .badge.soumise { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .badge.validee { background:var(--status-validated-bg); color:var(--status-validated-fg); }
  .badge.rejetee { background:var(--status-rejected-bg); color:var(--status-rejected-fg); }
  .ex { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:var(--text-muted); border:1px dashed var(--border-strong); border-radius:9px; padding:1px 7px; letter-spacing:.02em; text-transform:uppercase; }

  /* ============ Cockpit ============ */
  main { min-width:0; display:flex; flex-direction:column; }
  .cockpit { display:flex; flex-direction:column; gap:18px; }
  .section-titre { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .section-titre .ex { margin-left:auto; }

  /* Bandeau de commande */
  .bandeau { padding:16px 22px 14px; display:grid; grid-template-columns:1fr auto; gap:8px 20px; align-items:start; }
  .bandeau h2 { font-size:26px; font-weight:600; margin:0; line-height:1.1; }
  .bandeau .date { font-size:13px; color:var(--text-2); margin-top:6px; }
  .bandeau .contexte { font-size:12.5px; color:var(--text-2); margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; }
  .bandeau .contexte .fraicheur { color:var(--text-muted); }
  .bandeau .contexte .retard { color:var(--status-submitted-fg); font-weight:600; }
  .bandeau .commandes { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .champ { display:flex; flex-direction:column; gap:5px; }
  .champ label { font-size:12px; font-weight:600; color:var(--text-label); }
  .champ select, .champ input { min-height:34px; padding:0 10px; border:1px solid var(--field-border); border-radius:6px; background:var(--surface); color:var(--text); font:inherit; min-width:150px; }
  .champ select:disabled, .champ input:disabled { background:var(--disabled-bg); color:var(--disabled-fg); border-color:var(--panel-border); }
  .btn { min-height:34px; padding:6px 14px; border-radius:6px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px; }
  .btn.secondaire { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); min-height:36px; }
  .btn.secondaire:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .btn.fantome { color:var(--secondary); padding:6px 12px; }
  .btn.fantome:hover { background:var(--surface-subtle); }
  .btn:disabled { color:var(--disabled-fg); background:var(--disabled-bg); border-color:var(--panel-border); }
  .avert { background:var(--status-submitted-bg); border:1px solid var(--status-submitted-fg); color:var(--status-submitted-fg); border-radius:8px; padding:8px 14px; font-weight:600; font-size:12.5px; grid-column:1 / -1; }

  /* Instruments */
  /* 208 px : un montant N2 a dix chiffres tient en 27 px SemiBold sans troncature (172 px) ; la devise est dans la legende. */
  .instruments { display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:12px; }
  .instr { height:var(--tile-h); background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; padding:11px 14px 10px; display:flex; flex-direction:column; justify-content:space-between; text-align:left; box-shadow:0 2px 10px var(--shadow); transition:transform .13s cubic-bezier(.2,.7,.3,1), box-shadow .13s, border-color .13s; position:relative; min-width:0; }
  .instr:hover:not(:disabled) { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 14px var(--shadow-hover); }
  .instr:disabled { background:var(--surface-subtle); box-shadow:none; }
  .instr .tete { display:flex; align-items:center; gap:7px; min-width:0; }
  .instr .tete svg.ic { color:var(--accent-pressed); width:15px; height:15px; }
  .instr:disabled .tete svg.ic { color:var(--text-muted); }
  .instr .lib { font-size:11px; font-weight:600; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .instr .tete .badge { margin-left:auto; }
  .instr .valeur { font-size:27px; font-weight:600; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  [data-densite="compact"] .instr .valeur { font-size:18px; }
  .instr .valeur .u { font-size:11.5px; font-weight:600; color:var(--text-muted); margin-left:3px; }
  .instr .legende { font-size:11.5px; color:var(--text-muted); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  [data-densite="compact"] .instr .legende { -webkit-line-clamp:1; }
  .instr .tri { display:flex; gap:14px; align-items:baseline; }
  .instr .tri .mini { display:flex; flex-direction:column; }
  .instr .tri .mini b { font-size:18px; font-weight:600; line-height:1.1; }
  [data-densite="compact"] .instr .tri .mini b { font-size:16px; }
  .instr .tri .mini span { font-size:10.5px; color:var(--text-muted); font-weight:600; }
  .instr.squelette .valeur, .instr.squelette .legende { color:transparent; background:var(--surface-subtle); border-radius:6px; }
  .instr.squelette .valeur { width:70%; } .instr.squelette .legende { width:90%; }
  .instr.erreur { border-color:var(--danger-border); }
  .instr.erreur .valeur { font-size:13px; color:var(--text-2); font-weight:400; line-height:1.3; white-space:normal; }
  .instr.erreur .legende a { color:var(--secondary); font-weight:600; text-decoration:none; }
  .instr.demande .valeur { font-size:13px; font-weight:400; color:var(--text-2); white-space:normal; line-height:1.3; }
  .instr.sans-unite { border-style:dashed; box-shadow:none; }
  .instr.sans-unite .valeur { font-size:13px; font-weight:600; color:var(--text-2); white-space:normal; line-height:1.3; }
  .instr.sans-unite .legende { white-space:normal; }
  .instr.vide-profil { grid-column:1 / -1; height:auto; min-height:90px; align-items:center; justify-content:center; text-align:center; box-shadow:none; border-style:dashed; }

  /* Files */
  .files { display:flex; flex-wrap:wrap; gap:10px; }
  .file { height:var(--file-h); display:inline-flex; align-items:center; gap:10px; padding:0 14px 0 12px; background:var(--surface); border:1px solid var(--panel-border); border-radius:8px; text-align:left; transition:border-color .13s, background .13s; }
  .file:hover { border-color:var(--accent); background:var(--surface-hover); }
  .file .n { font-size:18px; font-weight:600; min-width:26px; text-align:right; }
  .file.zero .n { color:var(--text-muted); }
  .file .txt { display:flex; flex-direction:column; line-height:1.2; }
  .file .lib { font-size:12.5px; font-weight:600; }
  .file .sub { font-size:11px; color:var(--text-muted); }
  .file .fleche { color:var(--text-muted); font-size:16px; margin-left:2px; }
  .file.lien .n { display:none; }
  .files-vide { font-size:12px; color:var(--text-muted); margin:6px 0 0 2px; }

  /* Alertes + unites */
  .duo { display:grid; grid-template-columns:minmax(300px, 5fr) 7fr; gap:18px; align-items:stretch; }
  .duo > .carte { padding:16px 18px; display:flex; flex-direction:column; min-height:220px; position:relative; }
  .alertes { display:flex; flex-direction:column; gap:4px; }
  .alerte { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:7px 10px; border-radius:6px; text-align:left; min-height:44px; }
  .alerte:hover { background:var(--surface-subtle); }
  .alerte .sev { width:8px; height:8px; border-radius:50%; }
  .alerte .sev.critical { background:var(--danger); } .alerte .sev.watch { background:var(--status-submitted-fg); } .alerte .sev.signal { background:var(--text-muted); }
  .alerte .corps { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
  .alerte .titre { font-size:12.5px; font-weight:600; }
  .alerte .titre .sevlib { font-weight:600; color:var(--text-muted); font-size:11px; margin-right:6px; }
  .alerte .msg { font-size:11.5px; color:var(--text-2); }
  .alerte .meta { font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .carte-pied { margin-top:auto; padding-top:10px; display:flex; justify-content:flex-end; }
  .vide { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; pointer-events:none; padding:12px; }
  .vide svg { width:32px; height:32px; stroke-width:1.3; color:var(--text-muted); margin-bottom:6px; }
  .vide .titre { font-size:14px; font-weight:600; color:var(--text-2); }

const profil = () => PROFILS[etat.profil];

/* ======================= Composeur (miroir de CockpitComposer.Compose) ======================= */
function composer(prof) {
  const unite = uniteDe(prof);
  const instruments = INSTRUMENTS.filter(i => a(prof, i.perm) && !(i.sauf && a(prof, i.sauf)));
  const files = FILES.filter(f => a(prof, f.perm) && !(f.sauf && a(prof, f.sauf)) && !(f.scope === "unite" && !unite));
  const peutAgir = files.some(f => f.agit.some(k => a(prof, k)));
  const kpi = a(prof, "dashboard.read");
  const signauxPossibles = kpi || (a(prof, "lodging.read") && unite) || a(prof, "maintenance.read") || a(prof, "sync.read");
  return { unite, instruments, files, titreFiles: peutAgir ? "À décider" : "À suivre", alertes: signauxPossibles, unites: kpi, kpiMoteur: kpi };
}

function rendreInstrument(i, prof, comp, idx) {
  const ecran = nomEcran(i.tab);
  const titre = EX(i.route, i.perm, ecran);
  let cls = "instr", corps = "", nomA = "";
  const tete = (p = null) => `<div class="tete">${svg(i.icone)}<span class="lib">${i.lib}</span>${pill(p)}</div>`;
  if (etat.etatDonnees === "chargement" && i.tier === 2) {
    cls += " squelette"; nomA = `Chargement de ${i.lib}`;
    corps = `${tete()}<div class="valeur" aria-hidden="true">000 000,00</div><div class="legende" aria-hidden="true">chargement</div>`;
    return `<button type="button" class="${cls}" aria-busy="true" aria-label="${nomA}" disabled>${corps}</button>`;
  }
  if (etat.etatDonnees === "erreur" && i.id === "creances") {
    cls += " erreur"; nomA = `${i.lib} : indisponible. Réessayer`;
    corps = `${tete({ cls:"rejetee", lib:"Indisponible" })}<div class="valeur">Le serveur a répondu 503. Message dans le bandeau de session.</div><div class="legende"><a href="#" data-retry>Réessayer</a></div>`;
    return `<div class="${cls}" role="group" aria-label="${nomA}" title="${titre}">${corps}</div>`;
  }
  const d = i.rend(prof);
  if (d.tri) {
    corps = `${tete(d.pill)}<div class="tri">${d.tri.map(t => `<div class="mini"><b class="num">${t.val}</b><span>${t.lib}</span></div>`).join("")}</div><div class="legende">${d.legende}</div>`;
    nomA = `${i.lib} : ${d.tri.map(t => `${t.val} ${t.lib.toLowerCase()}`).join(", ")} ; ${d.legende}. Ouvrir ${ecran}`;
  } else {
    corps = `${tete(d.pill)}<div class="valeur num">${d.valeur}${d.u ? `<span class="u">${d.u}</span>` : ""}</div><div class="legende">${d.legende}</div>`;
    nomA = `${i.lib} : ${d.valeur} ${d.u || ""} ; ${d.legende}. Ouvrir ${ecran}`;
  }
  return `<button type="button" class="${cls}" data-tab="${i.tab}" title="${titre}" aria-label="${nomA}">${corps}</button>`;
}

function rendreInstruments(prof, comp) {
  const globaux = comp.instruments.filter(i => i.scope === "global");

  let html = globaux.map((i, k) => rendreInstrument(i, prof, comp, k)).join("");
  if (unites.length) {

function rendreFiles(prof, comp) {
  if (!comp.files.length) return "";
  const items = comp.files.map(f => {
    const peut = f.agit.some(k => a(prof, k));
    const lib = peut ? (typeof f.lib === "function" ? f.lib(prof) : f.lib) : f.constat;
    const tab = typeof f.tab === "function" ? f.tab(prof) : f.tab;
    const n = f.n(prof);
    const zero = n === 0;
    const nomA = f.lien ? `${lib}, ouvrir ${nomEcran(tab)}` : `${n} ${lib.toLowerCase()}, ${f.sub(prof)}. Ouvrir ${nomEcran(tab)}`;
    return `<button type="button" class="file ${zero ? "zero" : ""} ${f.lien ? "lien" : ""}" data-tab="${tab}" title="${EX(f.route, f.perm, nomEcran(tab))}" aria-label="${nomA}">

  }).join("");
  const tousZero = comp.files.every(f => !f.lien && f.n(prof) === 0);
  return `<div><h2 class="section-titre">${comp.titreFiles}${comp.titreFiles === "À suivre" ? ` <span class="ex" title="Aucune permission d'action sur ces files : constats, pas de verbes.">lecture seule</span>` : ""}</h2>

}

  });
  if (kpi) GROUPE.dec.unites.filter(u => u.attention).forEach(u => lignes.push({ sev:"signal", sevlib:"Signal", titre:`${u.code} · ${u.nom} demande attention`, msg:"Aucune recette hier et journée non clôturée (santé du jour, Cockpit DEC)", meta:"DEC", tab:20, route:"GET /pilotage/dec-cockpit (UnitHealth.NeedsAttention) · dashboard.read" }));
  if (a(prof, "lodging.read") && comp.unite && UNITE_DATA[comp.unite].dateMetier.late) { const bd = UNITE_DATA[comp.unite].dateMetier; lignes.push({ sev:"signal", sevlib:"Signal", titre:`Date métier ${comp.unite} en retard`, msg:`${bd.date} non clôturé · ${bd.pending} jour${bd.pending > 1 ? "s" : ""} de retard`, meta:"PMS", tab:a(prof, "closing.read") ? 5 : 30, route:"GET /lodging/business-date (IsLate, PendingDays) · lodging.read" }); }

  let corps;
  if (etat.etatDonnees === "chargement") corps = `<div aria-busy="true" aria-label="Chargement des alertes"><div class="squelette-bloc" style="width:80%"></div><div class="squelette-bloc" style="width:65%"></div><div class="squelette-bloc" style="width:72%"></div></div>`;

  else corps = `<div class="alertes" role="list">${lignes.map(l => `<button type="button" class="alerte" role="listitem" data-tab="${l.tab}" title="Exemple — ${l.route} · ouvre « ${nomEcran(l.tab)} »" aria-label="${l.sevlib}, ${l.titre}, ${l.msg}. Ouvrir ${nomEcran(l.tab)}">

  return `<div class="carte" aria-labelledby="t-alertes"><h2 class="section-titre" id="t-alertes">Alertes et signaux${kpi ? " — moteur KPI, J-1 → J" : ""} <span class="ex">Données d'exemple</span></h2>${corps}

  const lignes = DOMAINES.map(d => { const o = d.ecrans.filter(e => a(prof, e.perm)); const verrou = d.ecrans.length > 0 && o.length === 0; const att = d.ecrans.length === 0 || verrou;
    return `<div class="cat-ligne ${att ? "attenue" : ""}" title="${d.id} · ${d.nom}${verrou ? " — Accès non autorisé pour votre profil" : ""}"><span class="id">${d.id}</span>${svg(d.cle)}<span>${d.nom}</span>
      <span class="droite">${verrou ? svg("Cadenas", "cadenas", "0 0 12 12") : ""}<span class="nb">${d.ecrans.length ? `${o.length}/${d.ecrans.length} écran${d.ecrans.length > 1 ? "s" : ""}` : "—"}</span>${badge(d.maturite)}</span></div>`; }).join("");
  const espaceLiens = [
    a(prof, "audit.read") ? `<a href="#" data-tab="4">Mon activité → Journal d'audit</a>` : "",
    a(prof, "approvals.read") ? `<a href="#" data-tab="16">Validations</a>` : "",
  ].filter(Boolean).join("");
  return `<div class="pied">
    <div class="carte produit"><h2 class="section-titre">Où en est le produit ? <span class="ex" title="ModuleCatalog (statique client) : 50 modules, 31 disponibles. Ce n'est pas une donnée serveur et le cockpit le dit.">catalogue du client</span></h2>
      <div class="stats">
        <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-available)"></span>Disponible</div><div class="val">${n.dispo}</div></div>
        <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-api)"></span>API prête</div><div class="val">${n.api}</div></div>
        <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-partial)"></span>Partiel</div><div class="val">${n.partiel}</div></div>
        <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-planned)"></span>Planifié</div><div class="val">${n.plan}</div></div>
      </div>
      <div class="barre" aria-hidden="true"><span style="flex:${n.dispo};background:var(--progress-available)"></span><span style="flex:${n.plan};background:var(--progress-planned)"></span></div>
      <div class="legende">62 % du périmètre déjà utilisable · 31 modules disponibles sur 50 <button type="button" class="btn secondaire" id="btn-catalogue">Catalogue des modules (50)</button></div>
    </div>
    <div class="carte espace"><h2 class="section-titre">Mon Espace <span class="ex" title="Réponse de connexion (DisplayName, Roles) et GET /api/v1/me (email)">login · /me</span></h2>
      <div class="identite"><b>${prof.utilisateur}</b><span>${prof.login} · ${prof.email}</span><span>${prof.role}</span></div>
      <div class="liens"><button type="button" class="btn fantome" data-tab="9">Mon profil</button><button type="button" class="btn fantome" data-tab="9">Mes préférences</button><button type="button" class="btn fantome" data-secu>Ma sécurité</button></div>
      ${espaceLiens ? `<div class="liens-sec">${espaceLiens}</div>` : ""}
      <div class="carte-subtile planifie"><span>Notifications · Tâches · Agenda · Favoris · Messagerie</span>${badge("Planned", "", "Domaine 01 Mon Espace : sous-modules de l'arbre fonctionnel sans service serveur aujourd'hui (phase 4). Nommés, jamais cliquables.")}</div>
    </div>
  </div>
  <details class="carte catalogue" id="catalogue">
    <summary>${svg("Chevron", "chev", "0 0 9 7")}Catalogue des modules <span class="compteur">50</span><span class="aide">Ctrl+K ouvre cette section et place le curseur dans la recherche · les 50 cartes ModuleCatalogCard actuelles s'affichent ici telles quelles</span></summary>
    <div class="corps">
      <div class="recherche">${svg("Recherche")}<input type="search" id="home-search" placeholder="Rechercher un module…  (Ctrl+K)" aria-label="Rechercher un module"></div>
      <div class="puces" role="group" aria-label="Statut"><button type="button" class="puce" aria-pressed="true">Tous</button><button type="button" class="puce" aria-pressed="false">Disponibles</button><button type="button" class="puce" aria-pressed="false">API prête</button><button type="button" class="puce" aria-pressed="false">Partiels</button><button type="button" class="puce" aria-pressed="false">Planifiés</button></div>
      <div class="cat-lignes">${lignes}</div>
      <p class="cat-note">Résumé par domaine pour la maquette. Dans le client, cette section contient le bloc catalogue existant (puces de domaine, bandeau, recherche, puces de statut et de priorité, 50 cartes groupées Domaine → Module, état vide) sans changement de mécanique.</p>
    </div>
  </details>`;
}

function rendreCockpit() {
  const prof = profil(), comp = composer(prof);
  const sec = document.getElementById("cockpit");
  sec.innerHTML = `
    <p class="cat-note" style="margin:0 0 -6px 2px">Profil <b>${prof.nom}</b> — ${prof.note}</p>
    ${rendreBandeau(prof, comp)}
    ${rendreInstruments(prof, comp)}
    ${rendreFiles(prof, comp)}
    ${(comp.alertes || comp.unites) ? `<div class="duo" style="${comp.unites ? "" : "grid-template-columns:1fr"}">${comp.alertes ? rendreAlertes(prof, comp) : ""}${comp.unites ? rendreUnites(prof, comp) : ""}</div>` : ""}
    ${comp.kpiMoteur ? rendreKpi(prof, comp) : ""}
    ${rendrePied(prof, comp)}`;

  sec.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", ev => { ev.preventDefault(); ouvrir(+el.dataset.tab); }));
  sec.querySelectorAll("tr[data-tab]").forEach(tr => tr.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ouvrir(+tr.dataset.tab); } }));
  sec.querySelector("#c-unite")?.addEventListener("change", ev => { etat.uniteChoisie = ev.target.value || null; rendre(); });
  sec.querySelector("#btn-refresh")?.addEventListener("click", actualiser);
  sec.querySelector("#btn-kpi")?.addEventListener("click", () => { etat.kpiCharge[etat.profil] = true; rendre(); });
  sec.querySelector("#btn-catalogue")?.addEventListener("click", ouvrirCatalogue);
  sec.querySelector("[data-secu]")?.addEventListener("click", () => statut("Dialogue de changement de mot de passe (SecurityRequested → MainWindow.ShowChangePasswordDialog)."));
  sec.querySelector("[data-retry]")?.addEventListener("click", ev => { ev.preventDefault(); etat.etatDonnees = "donnees"; rendre(); });
}

/* ======================= Actions ======================= */
function ouvrir(tab) { statut(`NavigateToModule(${tab}) → « ${nomEcran(tab)} » — garde CanOpenModule puis ouverture de l'onglet ${tab} (maquette : aucun écran rendu).`); }
function statut(msg) { const s = document.querySelector("#sidebar .session-strip span:last-child"); if (s) s.textContent = msg; const b = document.getElementById("entete-session"); b.title = msg; if (etat.sidebar === "replie") { b.innerHTML = `<b>${profil().utilisateur}</b> · ${msg}`; setTimeout(rendreEntete, 3500); } }
function actualiser() { const d = new Date(); etat.heure = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; rendre(); statut(`Cockpit actualisé à ${etat.heure} (F5 → RefreshCockpitButton).`); }
function ouvrirCatalogue() { const c = document.getElementById("catalogue"); c.open = true; c.scrollIntoView({ block:"start", behavior:"smooth" }); document.getElementById("home-search").focus(); }
function rendreEntete() { const prof = profil(); document.getElementById("entete-session").innerHTML = `<b>${prof.utilisateur}</b> · ${prof.role.split(" (")[0]}`; }

/* ======================= Rendu global ======================= */
function rendre() {
  document.documentElement.dataset.theme = etat.theme;
  document.documentElement.dataset.densite = etat.densite;
  document.getElementById("app").classList.toggle("replie", etat.sidebar === "replie");
  document.getElementById("lbl-theme").textContent = etat.theme === "clair" ? "Sombre" : "Clair";
  document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.setAttribute("aria-pressed", b.dataset.profil === etat.profil));
  document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === etat.theme));
  document.querySelectorAll(".maquette-bar [data-sidebar]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sidebar === etat.sidebar));
  document.querySelectorAll(".maquette-bar [data-densite]").forEach(b => b.setAttribute("aria-pressed", b.dataset.densite === etat.densite));
  document.querySelectorAll(".maquette-bar [data-etat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.etat === etat.etatDonnees));
  rendreEntete(); rendreSidebar(); rendreAriane(); rendreCockpit();
}

const segProfil = document.getElementById("seg-profil");
Object.entries(PROFILS).forEach(([k, p]) => { const b = document.createElement("button"); b.type = "button"; b.dataset.profil = k; b.textContent = p.nom; b.title = p.role; b.setAttribute("aria-pressed", "false"); b.addEventListener("click", () => { etat.profil = k; etat.uniteChoisie = undefined; rendre(); }); segProfil.appendChild(b); });
document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.theme; rendre(); }));
document.querySelectorAll(".maquette-bar [data-sidebar]").forEach(b => b.addEventListener("click", () => { etat.sidebar = b.dataset.sidebar; rendre(); }));
document.querySelectorAll(".maquette-bar [data-densite]").forEach(b => b.addEventListener("click", () => { etat.densite = b.dataset.densite; rendre(); }));
document.querySelectorAll(".maquette-bar [data-etat]").forEach(b => b.addEventListener("click", () => { etat.etatDonnees = b.dataset.etat; rendre(); }));
document.getElementById("btn-theme").addEventListener("click", () => { etat.theme = etat.theme === "clair" ? "sombre" : "clair"; rendre(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "F5") { ev.preventDefault(); actualiser(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === "k") { ev.preventDefault(); ouvrirCatalogue(); }
  if (ev.altKey && ev.key === "Home") { ev.preventDefault(); window.scrollTo({ top:0, behavior:"smooth" }); statut("Alt+Origine → NavigateToModule(0) : déjà sur le cockpit."); }
});

rendre();
</script>
</body>
</html>
