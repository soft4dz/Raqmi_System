<!doctype html>
<html lang="fr" data-theme="clair" data-densite="confortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette de référence — Mon Espace · Mon travail (accueil Raqmi System)</title>
<!--
  Maquette de REFERENCE de l'accueil refondu (docs/design/accueil/refonte-accueil.md).
  Autonome : aucune dependance reseau, aucune police externe. Les couleurs sont les brushes de
  RaqmiTheme.xaml / ThemePalette.Sombre, clef par clef ; les SVG reprennent les geometries ModuleGroupIcon.* ;
  l'arbre de navigation est recopie de FunctionalArchitectureCatalog.Tree.cs et les 50 entrees de ModuleCatalog.cs.

  TOUTES LES DONNEES SONT DES EXEMPLES : aucun chiffre ne vient d'un serveur. Chaque carte porte en info-bulle la
  route et le champ qui l'alimenteraient. Les droits par profil sont ceux de SecuritySeeder (HEAD e7dcaad) ; le
  profil Reception est un role personnalise a creer (README, decision 8).

  Le composeur JavaScript (composer / projeter) est le miroir de HomeComposer / HomeProjection : une fonction pure
  des permissions et des reponses, sans aucun seuil ni calcul metier.
-->
<style>
  /* ============ Palette : brushes de RaqmiTheme.xaml (clair) / ThemePalette.Sombre ============ */
  :root, [data-theme="clair"] {
    --structure:#071525; --structure-elevated:#0C2135; --header-fg:#FFFFFF; --header-muted:#9FC3DC;
    --app-bg:#F4F7FA; --surface:#FFFFFF; --surface-subtle:#EEF4F8; --surface-hover:#E4EDF4;
    --panel-border:#DCE6EF; --field-border:#7A8FA3; --border-strong:#B9CCDD;
    --text:#0F2337; --text-2:#4A6A87; --text-muted:#5B6C7E; --text-label:#475569; --placeholder:#5C7188;
    --accent:#0AA3AD; --accent-hover:#0DB6C1; --accent-pressed:#088790;
    --accent-action:#07767D; --accent-action-hover:#08838B; --accent-action-fg:#FFFFFF;
    --accent-soft:#E1F4F5; --accent-selection:rgba(10,163,173,.18);
    --primary:#073B78; --secondary:#145CAB; --danger:#C0392B; --danger-soft:#FBECEA; --danger-border:#EFC9C4;
    --focus:#073B78; --focus-on-filled:#FFFFFF; --focus-on-dark:#FFFFFF;
    --disabled-bg:#E5EBF1; --disabled-fg:#576C82; --disabled-border:#DDE5EC;
    --module-active:rgba(10,163,173,.10);
    --row-hover:#F0F6FA; --row-alt:#FAFCFE; --grid-header-fg:#5B7591;
    --shadow:rgba(7,21,37,.07);
    --mat-planned-bg:#E8EEF4; --mat-planned-fg:#46617B; --mat-planned-accent:#7798B5;
    --mat-preview-bg:#FBEBC8; --mat-preview-fg:#8A5A08; --mat-preview-accent:#BF8B16;
    --mat-functional-bg:#DDF2F4; --mat-functional-fg:#096B73; --mat-functional-accent:#0AA3AD;
    --mat-ready-bg:#DCF3E5; --mat-ready-fg:#14713C; --mat-ready-accent:#1F9D57;
    --status-available-bg:#DCF3E5; --status-available-fg:#14713C;
    --status-planned-bg:#E8EEF4; --status-planned-fg:#46617B;
    --status-draft-bg:#E2E8F0; --status-draft-fg:#475569;
    --status-submitted-bg:#FCEFC7; --status-submitted-fg:#92600A;
    --status-validated-bg:#DBF2E3; --status-validated-fg:#187A41;
    --status-rejected-bg:#FBE3E1; --status-rejected-fg:#B3261E;
    --progress-available:#1F9D57; --progress-planned:#7798B5;
  }
  [data-theme="sombre"] {
    --structure:#050F1C; --structure-elevated:#0C1B2B; --header-fg:#EAF2F9; --header-muted:#8FB0CA;
    --app-bg:#0E1826; --surface:#152233; --surface-subtle:#1B2B3E; --surface-hover:#22344A;
    --panel-border:#26374D; --field-border:#62748D; --border-strong:#4B6E93;
    --text:#E6EEF7; --text-2:#AFC3D6; --text-muted:#98AFC6; --text-label:#C2D2E1; --placeholder:#8DA4BC;
    --accent:#22C4CE; --accent-hover:#3ED5DE; --accent-pressed:#16A8B1;
    --accent-action:#2FCBD6; --accent-action-hover:#4CDAE3; --accent-action-fg:#062227;
    --accent-soft:#0E3B40; --accent-selection:rgba(34,196,206,.24);
    --primary:#5B9BE8; --secondary:#6FAEF0; --danger:#F4776A; --danger-soft:#3A1A17; --danger-border:#5E2D28;
    --focus:#7FB6F5; --focus-on-filled:#08222A; --focus-on-dark:#EAF2F9;
    --disabled-bg:#1C2938; --disabled-fg:#8195AB; --disabled-border:#26374D;
    --module-active:rgba(34,196,206,.15);
    --row-hover:#1B2B3E; --row-alt:#182637; --grid-header-fg:#9CB3C9;
    --shadow:rgba(0,0,0,.35);
    --mat-planned-bg:#212F3F; --mat-planned-fg:#A8BCD0; --mat-planned-accent:#506D91;
    --mat-preview-bg:#3A2D12; --mat-preview-fg:#EFC15C; --mat-preview-accent:#E5B23A;
    --mat-functional-bg:#0E3439; --mat-functional-fg:#4FD3DC; --mat-functional-accent:#22C4CE;
    --mat-ready-bg:#11321F; --mat-ready-fg:#68D397; --mat-ready-accent:#3FBF74;
    --status-available-bg:#11321F; --status-available-fg:#68D397;
    --status-planned-bg:#212F3F; --status-planned-fg:#A8BCD0;
    --status-draft-bg:#26313E; --status-draft-fg:#C4D0DC;
    --status-submitted-bg:#3B2E11; --status-submitted-fg:#F5C761;
    --status-validated-bg:#11321F; --status-validated-fg:#68D397;
    --status-rejected-bg:#3A1A19; --status-rejected-fg:#F58C82;
    --progress-available:#3FBF74; --progress-planned:#506D91;
  }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family: Manrope, "Noto Kufi Arabic", "Segoe UI", sans-serif; font-size:13px; color:var(--text); background:var(--app-bg); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.thin { stroke-width:1.4; }
  [hidden] { display:none !important; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ============ Barre de la maquette (hors produit) ============ */
  .maquette-bar { background:var(--structure-elevated); color:var(--header-fg); font-size:12px; padding:8px 24px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
  .maquette-bar strong { color:var(--header-muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; font-size:10.5px; }
  .maquette-bar .grp { display:flex; align-items:center; gap:6px; }
  .maquette-bar .seg { display:inline-flex; border:1px solid rgba(255,255,255,.22); border-radius:15px; overflow:hidden; }
  .maquette-bar .seg button { padding:5px 11px; color:var(--header-fg); font-weight:600; font-size:12px; }
  .maquette-bar .seg button[aria-pressed="true"] { background:var(--accent); color:#062227; }
  .maquette-bar .note { margin-left:auto; color:var(--header-muted); }

  /* ============ En-tete (76 px, StructureBrush) ============ */
  header.entete { height:76px; flex:none; background:var(--structure); color:var(--header-fg); display:flex; align-items:center; padding:0 24px; gap:12px; }
  .marque { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-weight:600; font-size:20px; }
  .entete h1 { font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .entete .signature { font-size:12px; color:var(--header-muted); }
  .entete .session { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--header-muted); }
  .entete .session b { color:var(--header-fg); font-weight:600; }
  .entete .ghost { border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; color:var(--header-fg); font-size:12px; display:inline-flex; gap:8px; align-items:center; }
  .entete .ghost:focus-visible { outline-color:var(--focus-on-dark); }

  /* ============ Corps : barre laterale + contenu ============ */
  .app { flex:1; display:grid; grid-template-columns:248px 1fr; grid-template-rows:minmax(0, 1fr); gap:20px; padding:24px 24px 0; min-height:0; }
  .app.racine { grid-template-columns:1fr; }            /* SyncSidebarToTab : barre repliee a 0 px sur l'onglet 0 */
  .app.racine aside { display:none; }
  .carte { background:var(--surface); border:1px solid var(--panel-border); border-radius:10px; }
  aside { padding:18px 14px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .etiquette { font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px 14px; }
  .nav-btn { width:100%; height:40px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-radius:6px; color:var(--text-2); font-size:13px; text-align:left; position:relative; }
  .nav-btn:hover { background:var(--surface-subtle); }
  .nav-btn[aria-current="page"] { background:var(--module-active); color:var(--text); font-weight:600; }
  .nav-btn[aria-current="page"]::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:1.5px; background:var(--accent); }
  .recherche { position:relative; margin-top:12px; }
  .recherche input { width:100%; min-height:34px; padding:0 32px; border:1px solid var(--field-border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; }
  .recherche input::placeholder { color:var(--placeholder); }
  .recherche svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--placeholder); }
  .domaines { margin-top:14px; overflow:auto; flex:1; min-height:0; padding-right:4px; }
  .domaine { margin-bottom:2px; }
  .dom-tete { width:100%; height:36px; display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; padding:0 10px; border-radius:6px; color:var(--text); font-size:12.5px; font-weight:600; text-align:left; }
  [data-densite="compact"] .dom-tete { height:32px; }
  .dom-tete:hover { background:var(--surface-subtle); }
  .dom-tete svg.ic { color:var(--text-muted); margin-right:10px; }
  .dom-tete .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom-tete .compteur { background:var(--surface-subtle); color:var(--text-2); font-size:10.5px; font-weight:400; border-radius:8px; padding:1px 7px; margin-left:8px; }
  .dom-tete .chevron { width:9px; height:7px; margin-left:8px; color:var(--text-muted); transition:transform .12s; transform:rotate(-90deg); }
  .dom-tete[aria-expanded="true"] .chevron { transform:rotate(0); }
  .point { width:7px; height:7px; border-radius:50%; margin-left:8px; display:inline-block; }
  .point.preview { background:var(--mat-preview-accent); }
  .ecrans { margin:2px 0 8px; }
  .ecrans .nav-btn { height:34px; margin-left:8px; width:calc(100% - 8px); font-size:12.5px; margin-bottom:2px; }
  [data-densite="compact"] .ecrans .nav-btn { height:30px; }
  .epingle { border-top:1px solid var(--panel-border); margin-top:10px; padding-top:8px; }
  .epingle:empty { display:none; }

  /* ============ Bandeau de session (toutes les vues) ============ */
  .session-zone { padding:14px 24px 24px; flex:none; }
  .busy { height:4px; border-radius:2px; background:transparent; overflow:hidden; }
  .busy.actif { background:var(--surface-hover); }
  .busy.actif::after { content:""; display:block; height:100%; width:30%; background:var(--accent-action); animation:glisse 1.2s linear infinite; }
  @keyframes glisse { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  .session-strip { border-top:1px solid var(--panel-border); padding:10px 8px 8px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); border-radius:0 0 6px 6px; transition:background .3s; }
  .session-strip .etiquette { margin:0 4px 0 0; }
  .session-strip .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .session-strip.erreur .dot { background:var(--danger); }
  .session-strip.erreur span:last-child { color:var(--danger); }
  .session-strip.flash-info { background:var(--accent-soft); }
  .session-strip.flash-erreur { background:var(--danger-soft); }

  /* ============ Fil d'Ariane (masque sur l'onglet 0) ============ */
  .ariane { height:32px; display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:12px; flex:none; }
  .ariane svg.ic { color:var(--text-2); }
  .ariane button { color:var(--text-2); font-weight:600; padding:3px 6px; border-radius:5px; }
  .ariane button:hover { background:var(--surface-subtle); color:var(--text); }
  .ariane .courant { color:var(--text); font-weight:600; padding:3px 6px; }
  .ariane .sep { width:9px; height:7px; color:var(--text-muted); transform:rotate(-90deg); }
  .ariane .badge { margin-left:auto; }

  /* ============ Badges et pastilles (Status* / Maturity*) ============ */
  .badge { display:inline-flex; align-items:center; border-radius:9px; padding:2.5px 9px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .badge.planned { background:var(--mat-planned-bg); color:var(--mat-planned-fg); }
  .badge.preview { background:var(--mat-preview-bg); color:var(--mat-preview-fg); }
  .badge.functional { background:var(--mat-functional-bg); color:var(--mat-functional-fg); }
  .badge.ready { background:var(--mat-ready-bg); color:var(--mat-ready-fg); }
  .badge.dispo { background:var(--status-available-bg); color:var(--status-available-fg); }
  .badge.planifie { background:var(--status-planned-bg); color:var(--status-planned-fg); }
  .badge.draft { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .badge.soumise { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .badge.validee { background:var(--status-validated-bg); color:var(--status-validated-fg); }
  .badge.rejetee { background:var(--status-rejected-bg); color:var(--status-rejected-fg); }
  .badge.neutre { background:var(--surface-subtle); color:var(--text-2); }

  /* ============ Boutons de la charte ============ */
  .btn { min-height:36px; padding:7px 15px; border-radius:6px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px; }
  .btn.secondaire { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); }
  .btn.secondaire:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .btn.primaire { background:var(--accent-action); color:var(--accent-action-fg); padding:7px 18px; }
  .btn.primaire:hover { background:var(--accent-action-hover); }
  .btn.primaire:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .btn.fantome { min-height:34px; padding:6px 12px; color:var(--secondary); }
  .btn.fantome:hover { background:var(--surface-subtle); }
  .btn:disabled { color:var(--disabled-fg); background:var(--disabled-bg); border:1px solid var(--disabled-border); cursor:default; }
  .puce { border:1px solid var(--panel-border); background:var(--surface); border-radius:15px; padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--text-2); display:inline-flex; gap:8px; align-items:center; }
  .puce:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .puce[aria-pressed="true"] { background:var(--accent-action); border-color:var(--accent-action); color:var(--accent-action-fg); }
  .puce[aria-pressed="true"]:focus-visible { outline-color:var(--focus-on-filled); outline-offset:-3px; }
  .puce.compacte { padding:4px 11px; font-size:11.5px; }
  .puce .attenue { font-weight:400; color:var(--text-muted); }
  .puce[aria-pressed="true"] .attenue { color:var(--accent-action-fg); opacity:.85; }

  /* ============ Ecran (contenu de l'onglet) ============ */
  main { min-width:0; min-height:0; display:flex; flex-direction:column; }
  #ecran { flex:1; min-height:0; overflow:auto; }           /* = ScrollViewer de l'onglet */
  .accueil { display:flex; flex-direction:column; gap:20px; padding:0 6px 24px 0; }
  [data-densite="compact"] .accueil { gap:14px; }

  /* Onglets de section : styles SectionTabControl / SectionTabItem (TreasuryView.xaml:11-87) */
  .sections { display:flex; border-bottom:1px solid var(--panel-border); align-items:flex-end; }
  .sections .onglet { padding:9px 18px; font-size:13px; font-weight:600; color:var(--text-2); border-radius:6px 6px 0 0; position:relative; display:inline-flex; gap:8px; align-items:center; }
  .sections .onglet:hover { background:var(--surface-subtle); }
  .sections .onglet[aria-selected="true"] { color:var(--primary); }
  .sections .onglet[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2.5px; background:var(--accent); }
  .sections .exemple { margin-left:auto; font-size:11.5px; color:var(--text-muted); padding-bottom:8px; }

  /* Bandeau */
  .bandeau { padding:22px 24px 18px; display:grid; grid-template-columns:1fr auto; gap:16px 32px; align-items:start; }
  [data-densite="compact"] .bandeau { padding:16px 20px 14px; }
  .bandeau h2 { font-size:26px; font-weight:600; margin:0; line-height:1.15; }
  .bandeau .date { font-size:13px; color:var(--text-2); margin-top:7px; }
  .bandeau .synthese { font-size:12.5px; color:var(--text-2); margin-top:8px; }
  .bandeau .synthese b { color:var(--text); font-weight:600; }
  .bandeau .liens { display:flex; gap:4px; margin-top:12px; margin-left:-12px; flex-wrap:wrap; }
  .bandeau .droite { display:flex; flex-direction:column; gap:10px; min-width:320px; }
  .bandeau dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:center; }
  .bandeau dt { font-size:11px; font-weight:600; color:var(--text-label); }
  .bandeau dd { margin:0; font-size:12.5px; color:var(--text); font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bandeau dd .muet { color:var(--text-muted); font-weight:400; }
  .bandeau .actions { display:flex; align-items:center; gap:12px; justify-content:flex-end; }
  .bandeau .actualise { font-size:11.5px; color:var(--text-muted); }

  /* Encarts d'avertissement (WarningBanner promu de TreasuryView) */
  .avert { background:var(--status-submitted-bg); border:1px solid var(--status-submitted-fg); border-radius:8px; padding:9px 14px; color:var(--status-submitted-fg); font-size:13px; font-weight:600; display:flex; gap:10px; align-items:center; }
  .avert svg.ic { color:var(--status-submitted-fg); }
  .avert .lien { margin-left:auto; color:var(--status-submitted-fg); text-decoration:underline; font-weight:600; white-space:nowrap; }

  /* Bandes */
  .bande-tete { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--text-muted); margin:0 0 10px; letter-spacing:.02em; }
  .bande-tete .pt { width:8px; height:8px; border-radius:50%; }
  .bande-tete .nb { border-radius:8px; padding:1px 7px; font-size:10.5px; font-weight:600; }
  .bande-tete .suffixe { font-weight:400; }
  .bande-tete.attenue { margin-bottom:0; }
  .bande.retard .pt { background:var(--status-submitted-fg); } .bande.retard .nb { background:var(--status-submitted-bg); color:var(--status-submitted-fg); }
  .bande.jour .pt { background:var(--accent); } .bande.jour .nb { background:var(--surface-subtle); color:var(--text-2); }
  .bande.veille .pt { background:var(--text-muted); } .bande.veille .nb { background:var(--status-draft-bg); color:var(--status-draft-fg); }
  .files { display:grid; grid-template-columns:repeat(auto-fill, minmax(222px, 1fr)); gap:12px; }
  [data-densite="compact"] .files { gap:10px; }
  .file { padding:16px 14px 14px; min-height:104px; display:flex; flex-direction:column; gap:5px; }
  [data-densite="compact"] .file { padding:12px 12px 10px; min-height:88px; }
  .file .tete { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-muted); font-weight:600; }
  .file .tete svg { color:var(--text-muted); }
  .file .tete .cible-nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .perimetre { margin-left:auto; background:var(--surface-subtle); color:var(--text-2); border-radius:8px; padding:1px 7px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .file.suivi .perimetre, .file.zero .perimetre { background:var(--surface); }
  .file .compte { font-size:27px; font-weight:600; line-height:1.15; margin-top:6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .file .compte .montant { font-size:13px; font-weight:600; color:var(--text-2); }
  .file .libelle { font-size:13.5px; font-weight:600; }
  .file .legende { font-size:11.5px; color:var(--text-muted); }
  .file .cta { margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:8px; }
  .btn-file { min-height:32px; padding:5px 12px; border-radius:6px; font-weight:600; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; }
  .btn-file.act { background:var(--surface); border:1px solid var(--panel-border); color:var(--primary); }
  .btn-file.act:hover { background:var(--surface-subtle); border-color:var(--border-strong); }

  const slots = []; let unitairesIgnorees = 0;
  for (const q of FILES) {
    if (!has(q.lecture)) continue;
    const mode = q.action === null ? "info" : (has(q.action) ? "faire" : "suivi");
    if (q.perimetre === "unite" && !uniteCourante()) { unitairesIgnorees++; continue; }
    let tab = q.cible, verrou = false;
    if (!has(ECRANS[tab].e.perm)) { if (q.repli && has(ECRANS[q.repli].e.perm)) tab = q.repli; else verrou = true; }
    slots.push({ q, mode, tab, verrou, cible:ECRANS[tab] });
  }
  return { slots, unitairesIgnorees };
}
/* Projection (miroir de HomeProjection : fonction pure des reponses, bande finale = registre ou booleen serveur) */
function projeter(slot) {
  const q = slot.q;
  if (etat.simulation === "chargement") return { etat:"chargement", bande:q.bande, libelle:q.libelle };
  if (etat.simulation === "erreur" && SOURCES_EN_ERREUR.has(q.source)) return { etat:"indisponible", bande:q.bande, libelle:q.libelle };
  const r = q.projeter(donnees());
  const brut = typeof r.compte === "number" ? r.compte : (r.brut ?? 1);
  return { etat:"pret", compte:r.compte, brut, montant:r.montant || null, legende:r.legende, bande:r.bande || q.bande, libelle:r.libelle || q.libelle, verbe:r.verbe || q.verbe };
}
const ORDRE_MODE = { faire:0, suivi:1, info:2 };
function cartesParBande() {
  const { slots, unitairesIgnorees } = composer();
  const bandes = { retard:[], jour:[], veille:[] };
  const lisibles = { retard:0, jour:0, veille:0 }, composees = { retard:0, jour:0, veille:0 };
  for (const q of FILES) if (has(q.lecture)) lisibles[q.bande]++;
  for (const s of slots) {
    composees[s.q.bande]++;
    const p = projeter(s);
    if (p.bande === "masquee") continue;
    const zero = p.etat === "pret" && p.brut === 0;
    if (zero && p.bande !== "jour") continue;
    bandes[p.bande].push({ ...s, ...p, zero });
  }
  for (const b of Object.values(bandes)) b.sort((a, c) => ORDRE_MODE[a.mode] - ORDRE_MODE[c.mode]);
  const raison = b => lisibles[b] === 0 ? "NoQueues" : (composees[b] === 0 ? "UnitMissing" : "AllClear");
  return { bandes, unitairesIgnorees, raisons:{ retard:raison("retard"), jour:raison("jour"), veille:raison("veille") }, nbSlots:slots.length };
}

/* ======================= Rendu : une carte de file ======================= */
const PERIMETRE_LIB = { unite:() => uniteCourante() || "Unité", groupe:() => "Groupe · toutes unités", moi:() => "Ma décision", systeme:() => "Système", uniteOuGroupe:() => uniteCourante() || "Groupe · toutes unités" };
function rendreCarte(c) {
  const lib = c.libelle;
  const perim = PERIMETRE_LIB[c.q.perimetre]();
  const tete = `<div class="tete">${svg(c.cible.d.cle, "ic thin")}<span class="cible-nom">${c.cible.e.nom}</span><span class="perimetre" title="Périmètre de la donnée">${perim}</span></div>`;
  const titre = `title="Exemple — ${c.q.route.replace(/"/g, "&quot;")}"`;
  if (c.etat === "chargement") {
    return `<article class="carte file" ${titre} aria-label="${lib}, chargement" aria-busy="true">${tete}<div class="squelette" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="libelle">${lib}</div><div class="cta"><button type="button" class="btn-file voir" disabled>Chargement…</button></div></article>`;
  }
  if (c.etat === "indisponible") {
    return `<article class="carte file indispo" ${titre} aria-label="${lib}, indisponible">${tete}<div class="compte">—</div><div class="libelle">${lib}</div>
      <div class="legende">F5 pour réessayer · détail dans le bandeau de session</div>
      <div class="cta"><span class="badge rejetee">Indisponible</span></div></article>`;
  }
  const modeCls = c.mode === "suivi" ? "suivi" : (c.zero ? "zero" : "");
  const verbe = c.mode === "faire" ? c.verbe : (c.mode === "suivi" ? "Voir" : c.verbe);
  const btnCls = c.mode === "faire" ? "act" : "voir";
  const bouton = c.verrou
    ? `<button type="button" class="btn-file ${btnCls}" disabled title="Accès non autorisé pour votre profil (${c.cible.e.perm})" aria-label="${verbe} — accès non autorisé pour votre profil">${svg("Cadenas", "cadenas", "0 0 12 12")}${verbe}</button>`
    : `<button type="button" class="btn-file ${btnCls}" data-open="${c.tab}" aria-label="${verbe} — ${lib}, ouvre ${c.cible.e.nom}">${verbe} ${svg("Fleche")}</button>`;
  const suiviBadge = c.mode === "suivi" ? `<span class="badge draft" title="Vous pouvez lire cette file, pas agir dessus (${c.q.action} absent).">Suivi</span>` : "";
  const modeMot = c.mode === "faire" ? "à faire" : (c.mode === "suivi" ? "suivi" : "information");
  return `<article class="carte file ${modeCls}" ${titre} aria-label="${lib}, ${c.compte}${c.montant ? ", " + c.montant : ""}, ${perim}, ${modeMot}">
    ${tete}<div class="compte">${c.compte}${c.montant ? `<span class="montant">${c.montant}</span>` : ""}</div>
    <div class="libelle">${lib}</div><div class="legende">${c.legende}</div>
    <div class="cta">${bouton}${suiviBadge}</div></article>`;
}
const VIDES = {
  retard: { titre:"Rien en retard", indice:"Les arrivées, départs, clôtures, rejets et sauvegardes en retard apparaîtront ici.", picto:"Coche" },
  jour:   { titre:"Rien à traiter", picto:"Corbeille", indices:{
            NoQueues:"Aucune file de travail n'est ouverte à votre profil. Vos écrans restent accessibles par la barre latérale et le catalogue.",
            UnitMissing:"Vos files dépendent d'une unité : fixez l'unité de ce poste dans Paramétrage global › Poste de travail.",
            AllClear:"Aucune file composée n'a de chiffre à montrer." } },
  veille: { titre:"Rien à surveiller", indice:"Chambres hors service, articles sous le minimum et postes apparaîtront ici.", picto:"Oeil" },
};
function rendreBande(cle, libelle, cartes, raison) {
  const sansVerbe = cartes.length > 0 && !cartes.some(c => c.mode === "faire" && c.etat === "pret");
  const suffixe = sansVerbe ? `<span class="suffixe">· suivi seulement</span>` : "";
  /* Sans aucune file lisible, ou sans unite alors que seules des files unitaires etaient lisibles, la bande ne pretend
     pas « rien en retard » : rien n'a ete lu. Une ligne attenuee dit pourquoi (Aujourd'hui garde sa boite, raison typee). */
  if (cartes.length === 0 && raison !== "AllClear" && cle !== "jour") {
    const pourquoi = raison === "NoQueues" ? "aucune file ouverte à votre profil" : "dépend de l'unité du poste, non définie";
    return `<section class="bande ${cle}" aria-labelledby="bande-${cle}"><h3 class="bande-tete attenue" id="bande-${cle}"><span class="pt" aria-hidden="true"></span>${libelle}<span class="suffixe">· ${pourquoi}</span></h3></section>`;
  }
  let contenu;
  if (cartes.length) contenu = `<div class="files">${cartes.map(rendreCarte).join("")}</div>`;
  else {
    const v = VIDES[cle]; const indice = v.indices ? v.indices[raison] : v.indice;
    contenu = `<div class="vide-bande" aria-live="polite">${svg(v.picto)}<div class="titre">${v.titre}</div><div class="indice">${indice}</div></div>`;
  }
  return `<section class="bande ${cle}" aria-labelledby="bande-${cle}">
    <h3 class="bande-tete" id="bande-${cle}" aria-label="${libelle}, ${cartes.length} file${cartes.length > 1 ? "s" : ""}"><span class="pt" aria-hidden="true"></span>${libelle}<span class="nb" aria-hidden="true">${cartes.length}</span>${suffixe}</h3>${contenu}</section>`;
}

function estOuvrable(c) { return c.tab !== null && (!c.perm || has(c.perm)); }

    if (etat.filtreMaturite && MATURITE_MODULE[c.statut] !== etat.filtreMaturite) return false;

  /* Recherche universelle : NavigationTreeBuilder.Build(Tree, ..., NavigationFilter.Home with { SearchText, IncludeAliases }) */
  let resultats = "";
  if (nq) {
    const hits = [];
    for (const d of TREE) for (const m of d.modules) for (const s of m.sous) {

          <span class="droite" style="color:var(--accent)">${etat.filtreDomaine ? `${etat.filtreDomaine}  ${domaine(etat.filtreDomaine).nom}  →  modules` : "Tous les domaines  →  modules"}</span></div>
        <div class="filtres-ligne" role="group" aria-label="Domaine" style="margin-top:16px">
          <button type="button" class="puce" data-filtre="filtreDomaine" data-val="" aria-pressed="${etat.filtreDomaine === null}">Tous <span class="attenue">${CATALOGUE.length}</span></button>
          ${TREE.map(d => { const n = CATALOGUE.filter(c => DOMAINE_PAR_ORDRE[c.ordre] === d.id).length; return `<button type="button" class="puce" data-filtre="filtreDomaine" data-val="${d.id}" aria-pressed="${etat.filtreDomaine === d.id}" title="${d.nom}">${d.id} ${d.nom}<span class="attenue">${n}</span></button>`; }).join("")}
        </div>
      </div>

      <div class="carte carte-p">
        <div class="tete-carte"><p class="section-titre" style="margin:0">Avancement des modules</p><span class="droite">${Math.round(dispo * 100 / CATALOGUE.length)} % du périmètre déjà utilisable</span></div>
        <div class="avancement">
          <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-available)"></span>Disponible</div><div class="val">${dispo}</div></div>
          <div class="stat"><div class="lib"><span class="pt" style="background:var(--mat-functional-accent)"></span>API prête</div><div class="val">0</div></div>
          <div class="stat"><div class="lib"><span class="pt" style="background:var(--mat-preview-accent)"></span>Partiel</div><div class="val">0</div></div>
          <div class="stat"><div class="lib"><span class="pt" style="background:var(--progress-planned)"></span>Planifié</div><div class="val">${planif}</div></div>
        </div>
        <div class="barre" aria-hidden="true"><span style="flex:${dispo};background:var(--progress-available)"></span><span style="flex:${planif};background:var(--progress-planned)"></span></div>
        <div class="legende-barre">${dispo} modules disponibles sur ${CATALOGUE.length} · 0 avec API livrée, écran à venir · 0 partiellement couverts · ${planif} planifiés</div>
        <div class="legende-barre">Domaines : <span class="mdot" style="background:var(--mat-functional-accent)"></span>${compteDom.Functional} fonctionnels · <span class="mdot" style="background:var(--mat-preview-accent)"></span>${compteDom.TechnicalPreview} aperçus techniques · <span class="mdot" style="background:var(--mat-planned-accent)"></span>${compteDom.Planned} planifiés · <span class="mdot" style="background:var(--mat-ready-accent)"></span>${compteDom.ProductionReady} prêt pour la production — les deux échelles ne s'additionnent pas.</div>
        <div class="recherche-cat" style="margin-top:20px">${svg("Recherche")}<input id="home-search" type="search" value="${q.replace(/"/g, "&quot;")}" placeholder="Rechercher un module, un écran…  (Ctrl+K)" aria-label="Rechercher un module ou un écran" title="HomeSearchTextBox : filtre les ${CATALOGUE.length} modules et cherche dans l'arbre Domaine › Module › Sous-module › Écran"><button type="button" class="effacer" id="home-search-clear" title="Effacer la recherche (Échap)" aria-label="Effacer la recherche" ${q ? "" : "hidden"}>${svg("Croix", "ic", "0 0 16 16")}</button></div>
        <div style="margin-top:12px">
          ${chips("Statut", "filtreStatut", [[null,"Tous",`Afficher les ${CATALOGUE.length} modules`],["Disponible","Disponibles","Écrans utilisables dès maintenant"],["API prête","API prête","Backend livré et testé, écran client à venir"],["Partiel","Partiels","Partiellement couverts par l'existant"],["Planifié","Planifiés","Pas encore développés"]])}
          ${chips("Priorité", "filtrePrio", [[null,"Toutes"],["P0","P0","Socle et pilote"],["P1","P1","Cœur de l'ERP"],["P2","P2","Extensions"]])}
          ${chips("Maturité", "filtreMaturite", [[null,"Toutes"],["Functional","Fonctionnel"],["TechnicalPreview","Aperçu technique"],["Planned","Planifié"]])}
        </div>
      </div>

      ${resultats}
      <div>${groupes}${visibles.length === 0 ? `<p class="cat-vide">${nq ? `Aucun module ne correspond à « ${q} ». Échap efface la recherche.` : `Aucun module ne correspond à ces filtres. Revenez à « Tous » pour voir les ${CATALOGUE.length} modules.`}</p>` : ""}</div>
    </div>
  </div>`;
  brancher(sec);
  const champ = sec.querySelector("#home-search");
  champ.addEventListener("input", ev => { const pos = ev.target.selectionStart; etat.recherche = ev.target.value; rendreCatalogue(sec); const c2 = sec.querySelector("#home-search"); c2.focus(); c2.setSelectionRange(pos, pos); });
  champ.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && champ.value) { ev.preventDefault(); etat.recherche = ""; rendreCatalogue(sec); sec.querySelector("#home-search").focus(); }
    if (ev.key === "Enter") { const premier = sec.querySelector(".resultats [data-open]") || sec.querySelector(".carte-module[data-open]:not(:disabled)"); if (premier) ouvrir(+premier.dataset.open); else setStatus("Aucun écran ouvrable ne correspond à cette recherche."); }
  });
  sec.querySelector("#home-search-clear")?.addEventListener("click", () => { etat.recherche = ""; rendreCatalogue(sec); sec.querySelector("#home-search").focus(); });
  sec.querySelectorAll("[data-filtre]").forEach(b => b.addEventListener("click", () => { etat[b.dataset.filtre] = b.dataset.val === "" ? null : b.dataset.val; rendreCatalogue(sec); }));
}

/* ======================= Rendu : ecran cible (stub du shell, ouvert par une carte ou la barre laterale) ======================= */
const LIGNES_FICTIVES = {
  30: { colonnes:["Réservation","Client","Chambre","Nuits","Statut","Montant dû"],
    lignes:[["RSV-2026-0398","K. Amrani","118 · Twin","2","soumise|Arrivée dépassée","0,00"],["RSV-2026-0402","Sté Numidia Conseil","301 · Suite","3","soumise|Arrivée dépassée","0,00"],["RSV-2026-0412","A. Benali","204 · Double vue mer","2","validee|Confirmée","18 500,00"],["RSV-2026-0415","S. Haddad","— à affecter","1","validee|Confirmée","9 200,00"]] },
};
function rendreEcran(sec) {
  const { d, m, e } = etat.courant;
  const onglets = SOUS_ONGLETS[e.tab] || [];
  const idx = Math.min(etat.courant.onglet, Math.max(onglets.length - 1, 0));
  const donneesEcran = LIGNES_FICTIVES[e.tab];
  sec.className = "carte ecran";
  sec.innerHTML = `
    <div class="ecran-tete">
      <div><h2>${e.nom}</h2><div class="sous">${d.nom} › ${m.nom}. Écran cible ouvert depuis Mon Espace par NavigateToModule(${e.tab}) — v1 : l'onglet, pas le sous-onglet.</div></div>
      <div class="actions"><button type="button" class="btn secondaire" title="Actualiser (F5)">${svg("Actualiser")}Actualiser</button><button type="button" class="btn secondaire">Exporter CSV</button></div>
    </div>
    ${onglets.length ? `<div class="onglets" role="tablist" aria-label="Sous-onglets de ${e.nom}">${onglets.map((s, i) => `<button type="button" class="onglet" role="tab" aria-selected="${i === idx}" data-onglet="${i}">${s}</button>`).join("")}</div>` : ""}
    <div class="filtres">
      <div class="champ"><label for="f-date">Date métier</label><input id="f-date" type="text" value="01/09/2026"></div>
      <div class="champ"><label for="f-rech">Recherche</label><input id="f-rech" type="text" placeholder="Nom, référence…"></div>
      <div class="actions" style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn fantome" title="Ctrl+N">${svg("Plus")}Nouveau</button><button type="button" class="btn primaire" title="Ctrl+S">Enregistrer</button></div>
    </div>
    <div class="grille">
      <table>
        <thead><tr>${(donneesEcran ? donneesEcran.colonnes : ["Référence","Libellé","Unité","Date","Statut","Montant"]).map((c, i, a) => `<th class="${i === a.length - 1 ? "num" : ""}">${c}</th>`).join("")}</tr></thead>
        <tbody>${donneesEcran ? donneesEcran.lignes.map(l => `<tr>${l.map((c, i, a) => { if (c.includes("|")) { const [cls, lib] = c.split("|"); return `<td><span class="badge ${cls}">${lib}</span></td>`; } return `<td class="${i === a.length - 1 ? "num" : ""}">${c}</td>`; }).join("")}</tr>`).join("") : ""}</tbody>
      </table>
      ${donneesEcran ? "" : `<div class="vide" aria-live="polite">${svg("Corbeille")}<div class="titre">Aucun élément pour « ${onglets[idx] || e.nom} »</div><div class="indice">Écran cible (maquette) — choisissez une date métier ou créez un élément avec « Nouveau » (Ctrl+N).</div></div>`}
    </div>`;
  sec.querySelectorAll("[data-onglet]").forEach(b => b.addEventListener("click", () => { etat.courant.onglet = +b.dataset.onglet; rendreAriane(); rendreEcran(sec); }));
}

/* ======================= Rendu : barre laterale et fil d'Ariane (shell inchange) ======================= */
function rendreSidebar() {
  const aside = document.getElementById("sidebar");
  const ligneDomaine = d => {
    const ouvrables = ecransDuDomaine(d).filter(e => has(e.perm));
    if (ouvrables.length === 0) return "";
    const deroule = etat.deroules.has(d.id);
    const point = d.maturite === "TechnicalPreview" ? `<span class="point preview" role="img" aria-label="Aperçu technique"></span>` : "<span></span>";
    return `<div class="domaine">
      <button type="button" class="dom-tete" aria-expanded="${deroule}" data-toggle="${d.id}" aria-label="Domaine ${d.nom}, ${ouvrables.length} écran${ouvrables.length > 1 ? "s" : ""}" title="${d.id} · ${d.nom}">
        ${svg(d.cle, "ic thin")}<span class="nom">${d.nom}</span>${point}<span class="compteur">${ouvrables.length}</span>${svg("Chevron", "chevron", "0 0 9 7")}</button>
      <div class="ecrans" ${deroule ? "" : "hidden"}>${ouvrables.map(e => { const actif = !etat.racine && etat.courant && etat.courant.e === e;
        return `<button type="button" class="nav-btn" data-open="${e.tab}" ${actif ? 'aria-current="page"' : ""} aria-label="Ouvrir ${e.nom}${actif ? ", écran affiché" : ""}" title="${ECRANS[e.tab].m.nom} › ${ECRANS[e.tab].s.nom}">${e.nom}</button>`; }).join("")}</div></div>`;
  };
  aside.innerHTML = `<p class="etiquette">Modules</p>
    <button type="button" class="nav-btn" id="btn-racine" ${etat.racine ? 'aria-current="page"' : ""} aria-label="Mon Espace, accueil" title="Mon Espace (Alt+Origine) — libellé retenu par refonte-accueil.md § 1.3">${svg("MonEspace")}<span>Mon Espace</span></button>
    <div class="recherche">${svg("Recherche")}<input type="search" placeholder="Rechercher un écran…  (Ctrl+K)" aria-label="Rechercher un écran"></div>
    <div class="domaines">${TREE.filter(d => !d.epingle).map(ligneDomaine).join("")}</div>
    <div class="epingle">${TREE.filter(d => d.epingle).map(ligneDomaine).join("")}</div>`;
  aside.querySelector("#btn-racine").addEventListener("click", allerRacine);
  aside.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.toggle; etat.deroules.has(id) ? etat.deroules.delete(id) : etat.deroules.add(id); rendreSidebar(); }));
  brancher(aside);
}
function rendreAriane() {
  const nav = document.getElementById("ariane");
  if (etat.racine || !etat.courant) { nav.hidden = true; nav.innerHTML = ""; return; }
  const { d, m, s, e } = etat.courant;
  const sep = svg("Chevron", "sep", "0 0 9 7");
  nav.hidden = false;
  nav.innerHTML = `${svg(d.cle)}<button type="button" data-seg="dom" aria-label="Remonter à ${d.nom}">${d.id} ${d.nom}</button>${sep}<button type="button" data-seg="mod" aria-label="Remonter à ${m.nom}">${m.nom}</button>${sep}<span style="color:var(--text-2);font-weight:600;padding:3px 6px">${s.nom}</span>${sep}<span class="courant" aria-current="page">${e.nom}</span>${d.maturite === "TechnicalPreview" ? badge(d.maturite) : ""}`;
  nav.querySelector('[data-seg="dom"]').addEventListener("click", () => { etat.deroules.add(d.id); rendreSidebar(); document.querySelector(`[data-toggle="${d.id}"]`)?.focus(); });
  nav.querySelector('[data-seg="mod"]').addEventListener("click", () => ouvrir(e.tab));
}

/* ======================= Navigation : un seul chemin (NavigateToModule, garde CanOpenModule) ======================= */
function brancher(racine) {
  racine.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => ouvrir(+b.dataset.open)));
  racine.querySelectorAll("[data-section]").forEach(b => b.addEventListener("click", () => { etat.section = b.dataset.section; rendre(); if (etat.section === "catalogue" && b.closest(".produit")) document.getElementById("home-search")?.focus(); }));
}
function ouvrir(tab) {
  const cible = ECRANS[tab];
  if (!cible || !has(cible.e.perm)) { setStatus(`« ${cible ? cible.e.nom : "?"} » n'est pas ouvert à votre profil (CanOpenModule).`, true); return; }
  etat.racine = false; etat.courant = { ...cible, onglet:0 }; etat.deroules.add(cible.d.id);
  rendre(); document.getElementById("ecran").scrollTop = 0;
}
function allerRacine() { etat.racine = true; etat.courant = null; etat.section = "travail"; rendre(); document.getElementById("ecran").scrollTop = 0; }

/* ======================= Bandeau de session (SetStatus / FlashSessionStrip) ======================= */
let flashTimer = null;
function setStatus(message, erreur = false) {
  const strip = document.getElementById("session-strip");
  document.getElementById("session-texte").textContent = message;
  strip.classList.toggle("erreur", erreur);
  strip.classList.remove("flash-info", "flash-erreur"); void strip.offsetWidth;
  strip.classList.add(erreur ? "flash-erreur" : "flash-info");
  clearTimeout(flashTimer); flashTimer = setTimeout(() => strip.classList.remove("flash-info", "flash-erreur"), erreur ? 1600 : 900);
}
function actualiser() {
  if (!etat.racine) { setStatus("Cet écran n'a rien à actualiser (maquette)."); return; }
  const h = new Date(); etat.heure = `${String(h.getHours()).padStart(2, "0")}:${String(h.getMinutes()).padStart(2, "0")}`;
  rendre();
  if (etat.simulation === "erreur") setStatus("API 503 : Service Unavailable — le cockpit DEC et le tableau housekeeping n'ont pas répondu (exemple). Les autres files sont à jour.", true);
  else if (etat.simulation === "chargement") setStatus("Chargement des files de travail…");
  else setStatus(`Files de travail actualisées à ${etat.heure} (exemple).`);
}

/* ======================= Rendu global ======================= */
function rendre() {
  const prof = PROFILS[etat.profil];
  document.documentElement.dataset.theme = etat.theme;
  document.documentElement.dataset.densite = etat.densite;
  document.getElementById("app").classList.toggle("racine", etat.racine);
  document.getElementById("entete-session").innerHTML = `<b>${prof.utilisateur}</b> · ${prof.nom} · ${DONNEES_CHARGE.settings.company}`;
  document.getElementById("lbl-theme").textContent = etat.theme === "clair" ? "Sombre" : "Clair";
  document.getElementById("busy").classList.toggle("actif", etat.racine && etat.simulation === "chargement");
  for (const [attr, val] of [["profil", etat.profil], ["theme", etat.theme], ["densite", etat.densite], ["unite", etat.uniteReglee ? "oui" : "non"], ["sim", etat.simulation]])
    document.querySelectorAll(`.maquette-bar [data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === val));
  const sec = document.getElementById("ecran");
  rendreSidebar(); rendreAriane();
  if (etat.racine) { sec.className = ""; etat.section === "catalogue" ? rendreCatalogue(sec) : rendreTravail(sec); }
  else rendreEcran(sec);
}

document.querySelectorAll(".maquette-bar [data-profil]").forEach(b => b.addEventListener("click", () => { etat.profil = b.dataset.profil; etat.deroules.clear(); etat.uniteReglee = !PROFILS[etat.profil].siege; allerRacine(); setStatus(`Prêt. Connecté en tant que ${PROFILS[etat.profil].utilisateur} (${PROFILS[etat.profil].role}).`); }));
document.querySelectorAll(".maquette-bar [data-theme]").forEach(b => b.addEventListener("click", () => { etat.theme = b.dataset.theme; rendre(); }));
document.querySelectorAll(".maquette-bar [data-densite]").forEach(b => b.addEventListener("click", () => { etat.densite = b.dataset.densite; rendre(); }));
document.querySelectorAll(".maquette-bar [data-unite]").forEach(b => b.addEventListener("click", () => { etat.uniteReglee = b.dataset.unite === "oui"; rendre(); }));
document.querySelectorAll(".maquette-bar [data-sim]").forEach(b => b.addEventListener("click", () => { etat.simulation = b.dataset.sim; actualiser(); }));
document.getElementById("btn-theme").addEventListener("click", () => { etat.theme = etat.theme === "clair" ? "sombre" : "clair"; rendre(); setStatus("Apparence appliquée aux écrans non encore ouverts ; redémarrage conseillé pour les autres (RedemarrageConseille)."); });
document.addEventListener("keydown", ev => {
  if (ev.altKey && ev.key === "Home") { ev.preventDefault(); allerRacine(); }
  if (ev.key === "F5") { ev.preventDefault(); actualiser(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === "k") { ev.preventDefault(); if (etat.racine) { etat.section = "catalogue"; rendre(); document.getElementById("home-search")?.focus(); } else document.querySelector("#sidebar input")?.focus(); }
  if (ev.ctrlKey && ev.key === "Tab" && etat.racine) { ev.preventDefault(); etat.section = etat.section === "travail" ? "catalogue" : "travail"; rendre(); }
});

rendre();
setStatus(`Prêt. Connecté en tant que ${PROFILS[etat.profil].utilisateur} (${PROFILS[etat.profil].role}).`);
</script>
</body>
</html>
