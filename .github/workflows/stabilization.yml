name: stabilization

on:
  pull_request:
  push:
    branches:
      - stabilization/**
      - reorg/**

jobs:
  module-readiness:
    name: Module readiness gate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Le garde lit le code sans le compiler : il s'execute AVANT toute restauration
      # ou compilation, pour echouer vite et sans bruit. Il ecrit aussi le tableau de
      # readiness en Markdown dans readiness-summary.md.
      - name: Verify available modules are wired end-to-end (readiness gate)
        shell: pwsh
        run: ./tools/check-module-readiness.ps1 -MarkdownSummaryPath readiness-summary.md

      # Le tableau est publie dans le resume du job meme quand le garde echoue :
      # c'est la que se lisent les preuves manquantes et les niveaux prouves.
      - name: Publish readiness table to the job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path readiness-summary.md) {
            Get-Content readiness-summary.md -Raw -Encoding UTF8 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            Get-Content readiness-summary.md -Encoding UTF8
          }
          else {
            "Aucun tableau de readiness produit (echec avant le calcul des ecrans)." | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }

      - name: Upload readiness table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-summary
          path: readiness-summary.md
          if-no-files-found: ignore

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore desktop
        run: dotnet restore src/RaqmiSystem.Desktop/RaqmiSystem.Desktop.csproj

      - name: Build desktop
        run: dotnet build src/RaqmiSystem.Desktop/RaqmiSystem.Desktop.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/RaqmiSystem.Tests/RaqmiSystem.Tests.csproj

      - name: Run automated tests
        run: dotnet test tests/RaqmiSystem.Tests/RaqmiSystem.Tests.csproj --configuration Release --no-restore --verbosity normal
