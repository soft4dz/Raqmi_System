name: dotnet

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-core:
    name: Build API and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaqmiSystem.sln

      - name: Build API
        run: dotnet build src/RaqmiSystem.Api/RaqmiSystem.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/RaqmiSystem.Tests/RaqmiSystem.Tests.csproj --configuration Release --no-build --verbosity normal

  build-desktop:
    name: Build WPF desktop
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaqmiSystem.sln

      - name: Build desktop
        run: dotnet build src/RaqmiSystem.Desktop/RaqmiSystem.Desktop.csproj --configuration Release --no-restore
