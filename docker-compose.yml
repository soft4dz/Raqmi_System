services:
  postgres:
    image: postgres:16-alpine
    container_name: raqmi-postgres
    environment:
      POSTGRES_DB: raqmi_system
      POSTGRES_USER: raqmi
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - raqmi-postgres-data:/var/lib/postgresql/data

volumes:
  raqmi-postgres-data:
